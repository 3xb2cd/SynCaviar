const notePropertiesBody = document.getElementById('notePropertiesBody');

function round3(v){ return Math.round(v * 1000) / 1000; }

function npRow(labelText, inputEl){
  const row = document.createElement('div'); row.className = 'np-row';
  const label = document.createElement('label'); label.textContent = labelText;
  row.appendChild(label); row.appendChild(inputEl);
  return row;
}

function makeSlider(labelText, min, max, step, value, onInput, fmt, onCommit){
  const row = document.createElement('div'); row.className = 'np-row';
  const label = document.createElement('label'); label.textContent = labelText;
  const input = document.createElement('input');
  input.type = 'range'; input.min = min; input.max = max; input.step = step; input.value = value;
  const val = document.createElement('div'); val.className = 'np-value'; val.textContent = fmt(value);
  input.addEventListener('input', () => { const v = parseFloat(input.value); val.textContent = fmt(v); onInput(v); });
  if (onCommit) input.addEventListener('change', onCommit);
  row.appendChild(label); row.appendChild(input); row.appendChild(val);
  return row;
}

// A two-handle range slider for the vibrato zone: handles are tall
// rectangles (not round thumbs, so they read as distinct from the ordinary
// sliders above), the zone between them is highlighted, and the handles are
// "anonymous" -- either can be dragged past the other, and the active zone
// is always [min(a,b), max(a,b)], so there's no invalid state to prevent.
function makeDualHandleSlider(labelText, a, b, onChange, onCommit){
  const wrap = document.createElement('div'); wrap.className = 'np-group';
  const label = document.createElement('span'); label.className = 'np-group-label'; label.textContent = labelText;
  const track = document.createElement('div'); track.className = 'np-dual-track';
  const fill = document.createElement('div'); fill.className = 'np-dual-fill';
  const h1 = document.createElement('div'); h1.className = 'np-dual-handle';
  const h2 = document.createElement('div'); h2.className = 'np-dual-handle';
  track.appendChild(fill); track.appendChild(h1); track.appendChild(h2);
  wrap.appendChild(label); wrap.appendChild(track);

  let va = clamp(a, 0, 1), vb = clamp(b, 0, 1);
  function redraw(){
    const lo = Math.min(va, vb) * 100, hi = Math.max(va, vb) * 100;
    fill.style.left = lo + '%'; fill.style.width = (hi - lo) + '%';
    h1.style.left = (va * 100) + '%'; h2.style.left = (vb * 100) + '%';
  }
  redraw();

  function wireHandle(handle, getV, setV){
    let dragging = false;
    handle.addEventListener('pointerdown', (e) => {
      dragging = true; handle.setPointerCapture(e.pointerId); e.stopPropagation(); e.preventDefault();
    });
    handle.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const rect = track.getBoundingClientRect();
      const f = clamp((e.clientX - rect.left) / rect.width, 0, 1);
      setV(f); redraw(); onChange(va, vb);
    });
    handle.addEventListener('pointerup', () => { if (dragging){ dragging = false; if (onCommit) onCommit(va, vb); } });
  }
  wireHandle(h1, () => va, v => va = v);
  wireHandle(h2, () => vb, v => vb = v);
  // Clicking the bare track jumps the *nearest* handle there.
  track.addEventListener('pointerdown', (e) => {
    if (e.target !== track && e.target !== fill) return;
    const rect = track.getBoundingClientRect();
    const f = clamp((e.clientX - rect.left) / rect.width, 0, 1);
    if (Math.abs(f - va) <= Math.abs(f - vb)) va = f; else vb = f;
    redraw(); onChange(va, vb);
    if (onCommit) onCommit(va, vb);
  });
  return wrap;
}

function renderNoteProperties(){
  notePropertiesBody.innerHTML = '';
  const track = getCurrentTrack();
  if (!track || track.type !== 'synth'){
    notePropertiesBody.innerHTML = '<div class="np-empty">This track has no note data to edit.</div>';
    return;
  }
  if (state.selectedNoteIds.size === 0){
    notePropertiesBody.innerHTML = '<div class="np-empty">Select a note in the Piano Roll<br>to edit its properties.</div>';
    return;
  }
  if (state.selectedNoteIds.size > 1){
    notePropertiesBody.innerHTML = '<div class="np-multi">' + state.selectedNoteIds.size + ' notes selected.<br>'
      + '<span style="color:var(--text-faint);font-size:11px;">Select a single note to edit vibrato and timing.</span></div>';
    return;
  }
  const noteId = state.selectedNoteIds.values().next().value;
  const note = track.notes.find(n => n.id === noteId);
  if (!note){
    notePropertiesBody.innerHTML = '<div class="np-empty">Select a note in the Piano Roll<br>to edit its properties.</div>';
    return;
  }

  function commitTiming(origStart, origEnd){
    recomputeOverlaps(track);
    renderPianoRoll(); renderTrackEditorRows();
    // start/end feed the AI's pitch/power frames -- both where the note used
    // to sit and where it ended up need fresh audio.
    const lo = Math.min(origStart, origEnd, note.start, note.end);
    const hi = Math.max(origStart, origEnd, note.start, note.end);
    const { start, end } = beatsRangeToFrameRange(lo, hi);
    markTrackRangeDirty(track, start, end);
  }
  function refreshVisualOnly(){ renderPianoRoll(); renderTrackEditorRows(); }

  const pitchGroup = document.createElement('div'); pitchGroup.className = 'np-group';
  pitchGroup.innerHTML = '<span class="np-group-label">Pitch</span>'
    + '<div><span class="np-pitch-display">' + noteNumToName(note.pitch) + '</span>'
    + '<span class="np-pitch-sub">MIDI ' + note.pitch + '</span></div>';
  notePropertiesBody.appendChild(pitchGroup);

  const timeGroup = document.createElement('div'); timeGroup.className = 'np-group';
  const timeLabel = document.createElement('span'); timeLabel.className = 'np-group-label'; timeLabel.textContent = 'Timing (beats)';
  timeGroup.appendChild(timeLabel);
  const startInput = document.createElement('input');
  startInput.type = 'number'; startInput.step = '0.05'; startInput.value = round3(note.start);
  startInput.addEventListener('change', () => {
    const origStart = note.start, origEnd = note.end;
    const v = parseFloat(startInput.value);
    if (!isNaN(v)) note.start = clamp(v, 0, note.end - 0.03125);
    startInput.value = round3(note.start);
    commitTiming(origStart, origEnd);
  });
  const endInput = document.createElement('input');
  endInput.type = 'number'; endInput.step = '0.05'; endInput.value = round3(note.end);
  endInput.addEventListener('change', () => {
    const origStart = note.start, origEnd = note.end;
    const v = parseFloat(endInput.value);
    if (!isNaN(v)) note.end = Math.max(v, note.start + 0.03125);
    endInput.value = round3(note.end);
    commitTiming(origStart, origEnd);
  });
  timeGroup.appendChild(npRow('Start', startInput));
  timeGroup.appendChild(npRow('End', endInput));
  notePropertiesBody.appendChild(timeGroup);

  const lyricGroup = document.createElement('div'); lyricGroup.className = 'np-group';
  const lyricLabel = document.createElement('span'); lyricLabel.className = 'np-group-label'; lyricLabel.textContent = 'Lyric';
  lyricGroup.appendChild(lyricLabel);
  const lyricInput = document.createElement('input');
  lyricInput.type = 'text'; lyricInput.placeholder = '(unlabeled)'; lyricInput.value = note.lyric || '';
  lyricInput.style.width = '100%';
  lyricInput.addEventListener('change', () => {
    note.lyric = lyricInput.value;
    refreshVisualOnly();
    onNoteFieldEditCommitted(track, note); // lyric feeds the AI's LyricArr frames
  });
  lyricGroup.appendChild(lyricInput);
  notePropertiesBody.appendChild(lyricGroup);

  const vibRangeGroup = makeDualHandleSlider('Vibrato range', note.vibrato.rangeStart, note.vibrato.rangeEnd,
    (a, b) => { note.vibrato.rangeStart = a; note.vibrato.rangeEnd = b; renderPianoRoll(); },
    () => onNoteFieldEditCommitted(track, note));
  notePropertiesBody.appendChild(vibRangeGroup);

  const vibGroup = document.createElement('div'); vibGroup.className = 'np-group';
  vibGroup.appendChild(makeSlider('Frequency', 1, 10, 0.1, note.vibrato.frequency,
    v => { note.vibrato.frequency = v; renderPianoRoll(); }, v => v.toFixed(1) + 'Hz',
    () => onNoteFieldEditCommitted(track, note)));
  vibGroup.appendChild(makeSlider('Depth', -1, 1, 0.01, note.vibrato.depth,
    v => { note.vibrato.depth = v; renderPianoRoll(); }, v => v.toFixed(2),
    () => onNoteFieldEditCommitted(track, note)));
  notePropertiesBody.appendChild(vibGroup);
}

const noteWaveCanvas   = document.getElementById('noteWaveCanvas');
const noteWaveCtx      = noteWaveCanvas.getContext('2d');
const waveCanvasWrap   = document.getElementById('waveCanvasWrap');
const waveModeLabel    = document.getElementById('waveModeLabel');
const waveModePitchBtn = document.getElementById('waveModePitch');
const waveModePowerBtn = document.getElementById('waveModePower');
const waveToolbarEl    = document.getElementById('waveToolbar');

// The wave canvas sits directly to the right of a 75px sidebar (waveSidebar)
// that stands in for the piano-key column, so its local x=0 lines up with
// the piano roll's grid area (i.e. its local x=pianoKeyWidth).
function waveWorldToScreenX(worldX){ return timeWorldToScreenX(worldX) - pianoKeyWidth; }
function waveScreenToWorldX(screenX){ return timeScreenToWorldX(screenX + pianoKeyWidth); }
function waveValueToY(value, heightCss){ return ((1.1 - value) / 1.2) * heightCss; }
function waveYToValue(y, heightCss){ return 1.1 - (y / heightCss) * 1.2; }
function sampleIndexAtWorldX(worldX){ return Math.round(beatsToSeconds(worldXToBeats(worldX)) * SAMPLE_RATE_HZ); }

function getCurveValue(track, mode, idx){
  const arr = mode === 'pitch' ? track.pitchCurve : track.powerCurve;
  const v = arr[idx];
  return (v === undefined) ? 0.5 : v;
}
function setCurveValue(track, mode, idx, value){
  if (idx < 0) return;
  const arr = mode === 'pitch' ? track.pitchCurve : track.powerCurve;
  arr[idx] = clamp(value, 0, 1);
}

// Pitch/power curves are stored by absolute 80fps frame index (real time),
// while notes are stored in beats -- so a note automatically stays put in
// time when BPM changes, but a curve doesn't. This just moves each existing
// point to its new stretched-or-squeezed index (ratio = oldBpm/newBpm, so
// 120->60 stretches everything 2x) so the curve stays lined up with the
// notes. No smoothing or resampling -- a plain index remap is all this
// needs; a couple of points landing on the same new index when compressing
// is an acceptable, expected loss.
function rescaleCurve(curve, ratio){
  if (!curve || ratio === 1) return curve;
  const out = [];
  curve.forEach((v, i) => { out[Math.round(i * ratio)] = v; });
  return out;
}

function drawCurveLine(ctx, track, mode, widthCss, heightCss, color, lineWidth){
  ctx.strokeStyle = color; ctx.lineWidth = lineWidth;
  ctx.beginPath();
  let first = true;
  for (let px = 0; px <= widthCss; px += 2){
    const idx = sampleIndexAtWorldX(waveScreenToWorldX(px));
    const y = waveValueToY(getCurveValue(track, mode, idx), heightCss);
    if (first){ ctx.moveTo(px, y); first = false; } else ctx.lineTo(px, y);
  }
  ctx.stroke();
}

function renderNoteWave(){
  const { width, height } = fitCanvasToParent(noteWaveCanvas);
  const ctx = noteWaveCtx;
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = PALETTE.waveBg; ctx.fillRect(0, 0, width, height);

  // Trackline gridlines, kept in exact sync with the Piano Roll's bar math.
  const barWidth = actualBarWidthPx();
  const leftBarIdx = (state.view.pianoTime.x + pianoKeyWidth) / barWidth;
  const rightBarIdx = (width + pianoKeyWidth) / barWidth + leftBarIdx;
  const nSub = currentSubdivisionsPerBar();
  for (let bar = Math.floor(leftBarIdx); bar < rightBarIdx; bar++){
    const x = waveWorldToScreenX(bar * barWidth);
    if (nSub > 1){
      for (let i = 1; i < nSub; i++){
        const subX = x + (barWidth / nSub) * i;
        ctx.strokeStyle = PALETTE.gridLineSoft; ctx.lineWidth = (nSub / i === 2) ? 1.1 : 0.6;
        ctx.beginPath(); ctx.moveTo(Math.round(subX)+0.5, 0); ctx.lineTo(Math.round(subX)+0.5, height); ctx.stroke();
      }
    }
    ctx.strokeStyle = PALETTE.gridBar; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(Math.round(x)+0.5, 0); ctx.lineTo(Math.round(x)+0.5, height); ctx.stroke();
  }

  ctx.strokeStyle = PALETTE.waveBounds; ctx.lineWidth = 1; ctx.setLineDash([4,3]);
  [0, 1].forEach(v => { const y = waveValueToY(v, height); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(width,y); ctx.stroke(); });
  ctx.setLineDash([]);

  // Light center reference line at the default/neutral value.
  ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 1; ctx.setLineDash([2,4]);
  const midY = waveValueToY(0.5, height);
  ctx.beginPath(); ctx.moveTo(0, midY); ctx.lineTo(width, midY); ctx.stroke();
  ctx.setLineDash([]);

  drawPlayheadLine(ctx, waveWorldToScreenX(beatsToWorldX(secondsToBeats(playheadSec))), width, height);

  const track = getCurrentTrack();
  if (!track || track.type !== 'synth'){
    ctx.fillStyle = 'rgba(233,230,223,0.35)'; ctx.font = '12px ' + FONT_SANS;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(track ? 'Audio tracks have no pitch/power data' : 'No track selected', width/2, height/2);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    return;
  }
  const otherMode = state.waveMode === 'pitch' ? 'power' : 'pitch';
  drawCurveLine(ctx, track, otherMode, width, height, PALETTE.waveLineDim, 1.2);
  drawCurveLine(ctx, track, state.waveMode, width, height, PALETTE.waveLine, 2);
}

function setWaveMode(mode){
  state.waveMode = mode;
  waveModePitchBtn.classList.toggle('active', mode === 'pitch');
  waveModePowerBtn.classList.toggle('active', mode === 'power');
  waveModeLabel.textContent = 'editing ' + mode;
  renderNoteWave();
}
waveModePitchBtn.addEventListener('click', () => setWaveMode('pitch'));
waveModePowerBtn.addEventListener('click', () => setWaveMode('power'));

function buildWaveToolbar(){
  waveToolbarEl.innerHTML = '';
  const btn = document.createElement('button');
  btn.className = 'tool-btn active'; btn.title = 'Draw';
  btn.innerHTML = TOOL_ICONS.pencil;
  waveToolbarEl.appendChild(btn);
}
buildWaveToolbar();

// ---- Interaction: drawing, and view pan/zoom on the shared X timeline ----
// Mouse move events are choppy at speed, so instead of writing only the point
// under the cursor we interpolate every 80Hz sample between the previous and
// current pointer position, matching the model's sample rate.
let waveInteraction = null;

function waveApplyPoint(track, screenX, screenY, heightCss){
  const idx = sampleIndexAtWorldX(waveScreenToWorldX(screenX));
  const value = clamp(waveYToValue(screenY, heightCss), 0, 1);
  if (waveInteraction.lastIdx !== null){
    const i0 = waveInteraction.lastIdx, v0 = waveInteraction.lastValueRaw;
    const steps = Math.abs(idx - i0);
    for (let s = 0; s <= steps; s++){
      const t = steps === 0 ? 1 : s / steps;
      setCurveValue(track, state.waveMode, Math.round(i0 + (idx - i0) * t), v0 + (value - v0) * t);
    }
  } else {
    setCurveValue(track, state.waveMode, idx, value);
  }
  waveInteraction.lastIdx = idx; waveInteraction.lastValueRaw = value;
  waveInteraction.minIdx = (waveInteraction.minIdx === undefined) ? idx : Math.min(waveInteraction.minIdx, idx);
  waveInteraction.maxIdx = (waveInteraction.maxIdx === undefined) ? idx : Math.max(waveInteraction.maxIdx, idx);
}

noteWaveCanvas.addEventListener('pointerdown', (e) => {
  if (e.button === 1){
    e.preventDefault();
    noteWaveCanvas.setPointerCapture(e.pointerId);
    waveInteraction = { type:'pan', lastX: e.clientX };
    return;
  }
  if (e.button !== 0) return;
  const track = getCurrentTrack();
  if (!track || track.type !== 'synth') return;
  noteWaveCanvas.setPointerCapture(e.pointerId);
  const rect = noteWaveCanvas.getBoundingClientRect();
  waveInteraction = { type:'draw', lastIdx: null, lastValueRaw: 0.5 };
  waveApplyPoint(track, e.clientX - rect.left, e.clientY - rect.top, rect.height);
  renderNoteWave();
});
noteWaveCanvas.addEventListener('pointermove', (e) => {
  if (!waveInteraction) return;
  if (waveInteraction.type === 'pan'){
    state.view.pianoTime.x -= (e.clientX - waveInteraction.lastX);
    waveInteraction.lastX = e.clientX;
    clampPianoTimeX();
    renderNoteWave(); renderPianoRoll();
    return;
  }
  const track = getCurrentTrack();
  if (!track || track.type !== 'synth') return;
  const rect = noteWaveCanvas.getBoundingClientRect();
  waveApplyPoint(track, e.clientX - rect.left, e.clientY - rect.top, rect.height);
  renderNoteWave();
});
function waveFinishStroke(){
  if (!waveInteraction) return;
  const wasDraw = waveInteraction.type === 'draw';
  const track = getCurrentTrack();
  const minIdx = waveInteraction.minIdx, maxIdx = waveInteraction.maxIdx;
  waveInteraction = null;
  if (wasDraw && track && minIdx !== undefined) markTrackRangeDirty(track, minIdx, maxIdx);
  renderNoteWave();
}
window.addEventListener('pointerup', waveFinishStroke);
noteWaveCanvas.addEventListener('pointercancel', waveFinishStroke);
noteWaveCanvas.addEventListener('contextmenu', e => e.preventDefault());

// Shares the Piano Roll's X timeline (position + zoom); intentionally has no
// Y-axis equivalent to zoom/pan since the value view is the fixed -0.1..1.1
// range, not a scrollable axis.
waveCanvasWrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = noteWaveCanvas.getBoundingClientRect();
  const mouseInWindow = (e.clientX - rect.left) + pianoKeyWidth; // same reference frame as the Piano Roll's zoom anchor
  const wheel = -e.deltaY / 100;
  if (e.ctrlKey && e.shiftKey){
    const past = state.view.pianoTime.zoomX;
    const z = clamp(past + 0.1 * wheel, 0.1, 3.2);
    state.view.pianoTime.zoomX = z;
    if (wheel !== 0) state.view.pianoTime.x = (state.view.pianoTime.x + mouseInWindow) * (z / past) - mouseInWindow;
  } else if (!e.ctrlKey){
    // shift+scroll or a plain scroll both pan X -- there's no Y axis here to
    // reserve plain-scroll for, unlike the Piano Roll. Pixel-space speed,
    // not scaled by zoom (see the TrackEditor wheel handler for why).
    state.view.pianoTime.x += wheel * 12.5;
  }
  clampPianoTimeX();
  renderNoteWave(); renderPianoRoll();
}, { passive:false });

observeResize(waveCanvasWrap, () => renderNoteWave());

// NOTE ON ARCHITECTURE: the spectrograminator + vocoder run server-side, on
// a Hugging Face Space (CAVIAR_SPACE_ID above) exposing /ping and /inferpls
// through the Gradio JS client -- no access token needed, no /load step
// (every singer's weights are loaded at server boot). BackendSinger (further
// down) implements that protocol: one /inferpls call per render, sending a
// window-batched SnOps buffer and a singer name, getting back a spectrogram
// (debug-only) and the final PCM audio. See the SnOps-building functions
// right below for the exact 67-channel [Pitch, Power, LyricArr] format the
// model expects.

function findActiveNote(track, beat){
  for (const n of track.notes){ if (beat >= n.start && beat < n.end) return n; }
  return null;
}
function trackEndBeats(track){
  let end = 0;
  track.notes.forEach(n => { if (n.end > end) end = n.end; });
  return end;
}

// Vibrato's instantaneous pitch offset in semitones, matching the same
// +/-0.5 semitone range as the pitch curve (depth=1 <-> +/-0.5 semitones),
// zero outside the note's [rangeStart, rangeEnd] window.
function vibratoOffsetAt(note, sec){
  if (!note.vibrato) return 0;
  const noteLenSec = beatsToSeconds(note.end - note.start);
  const relSec = sec - beatsToSeconds(note.start);
  const lo = Math.min(note.vibrato.rangeStart, note.vibrato.rangeEnd) * noteLenSec;
  const hi = Math.max(note.vibrato.rangeStart, note.vibrato.rangeEnd) * noteLenSec;
  if (relSec < lo || relSec > hi) return 0;
  return note.vibrato.depth * 0.5 * Math.sin(2 * Math.PI * note.vibrato.frequency * (relSec - lo));
}

// Only AA/EE/IY/UW/OO are trained; anything else -- an untrained phoneme,
// a typo, or no lyric at all -- defaults to AA rather than sending something
// the model has never seen.
function normalizeLyric(lyric){
  const up = (lyric || '').trim().toUpperCase();
  return TRAINED_LYRICS.includes(up) ? up : 'AA';
}
function lyricOneHot(lyric){
  const arr = new Array(SC_STD_LYRICS.length).fill(0);
  arr[SC_STD_LYRICS.indexOf(normalizeLyric(lyric))] = 1;
  return arr;
}
// The model was trained on Hz, not raw MIDI note numbers (confirmed after
// the model came out sounding like near-silent nothing on raw MIDI) -- but
// only right here, at the last possible moment before the formal SoundOptions
// goes to the backend. `frame.pitch` itself stays raw MIDI everywhere
// upstream (buildSnOpsFrames, the wave editor, SinnieSinger's own placeholder
// synth all expect/produce raw MIDI), so this is the single choke point
// where the conversion happens -- converting earlier would double-convert
// wherever else frame.pitch is read.
function hzOfMidi(midi){ return 440 * Math.pow(2, (midi - 69) / 12); }

// Likewise, the model's Power channel needs to run hotter than the
// intuitive 0..1 slider range: a neutral 0.5 (the default/untouched curve
// value) was coming out as near-silence server-side. This remaps *only* the
// value sent in the formal SoundOptions -- the wave editor's displayed and
// stored 0..1 curve is untouched, as is SinnieSinger's own placeholder
// synth. Endpoints stay fixed (0 = silent, 1 = full); the default midpoint
// 0.5 now lands at POWER_MIDPOINT_TARGET, piecewise-linear on either side.
const POWER_MIDPOINT_TARGET = 0.8;
function remapPowerForBackend(p){
  p = clamp(p, 0, 1);
  if (p <= 0.5) return (p / 0.5) * POWER_MIDPOINT_TARGET;
  return POWER_MIDPOINT_TARGET + ((p - 0.5) / 0.5) * (1 - POWER_MIDPOINT_TARGET);
}
// [Pitch(Hz), Power(0..1, backend-remapped), ...LyricArr(65)] = 67 values,
// in exactly that order -- matches cols = ['Pitch','Power','LyricArr'].
function snOpsFrameVector(frame){
  return [hzOfMidi(frame.pitch), remapPowerForBackend(frame.power), ...lyricOneHot(frame.lyric)];
}

// Builds {pitch, power, lyric} at 80fps for frame indices [startIdx, endIdx).
// No separate silence flag: a frame with no active note is masked directly
// (Power=0, Lyric=AA) rather than carrying a flag through the pipeline --
// matches "mask regions with no active note with Power=0, Lyric=AA".
// Pitch is the *unnormalized* MIDI note number, still shifted by both the
// NoteWaveEditor pitch curve and vibrato (both +/-0.5 semitone conventions).
function buildSnOpsFrames(track, startIdx, endIdx){
  const frames = [];
  for (let i = startIdx; i < endIdx; i++){
    const sec = i / SAMPLE_RATE_HZ;
    const beat = secondsToBeats(sec);
    const note = findActiveNote(track, beat);
    if (!note){ frames.push({ pitch: NOTE_MIN, power: 0, lyric: 'AA' }); continue; }
    const waveOptPitch = getCurveValue(track, 'pitch', i);
    const waveOptPower = getCurveValue(track, 'power', i);
    const pitch = note.pitch + (waveOptPitch - 0.5) + vibratoOffsetAt(note, sec);
    frames.push({ pitch, power: waveOptPower, lyric: note.lyric });
  }
  return frames;
}

// Builds the (nFrames, 67, 13) batch PimpSpec expects: for each output frame
// i, a window of the 13 SnOps frames centered on it (6 before, 6 after).
// Padding beyond the track's own start/end falls out of buildSnOpsFrames()
// for free -- those are just more "no active note" frames, silence-masked
// the same as any other gap.
function buildSnOpsWindowBatch(track, startIdx, endIdx){
  const nFrames = Math.max(0, endIdx - startIdx);
  if (nFrames === 0) return { data: new Float32Array(0), n: 0 };
  const half = SNOPS_WINDOW_HALF;
  const padded = buildSnOpsFrames(track, startIdx - half, endIdx + half); // length nFrames + 2*half
  const data = new Float32Array(nFrames * SNOPS_FEATURE_COUNT * SNOPS_WINDOW);
  for (let i = 0; i < nFrames; i++){
    for (let w = 0; w < SNOPS_WINDOW; w++){
      const vec = snOpsFrameVector(padded[i + w]);
      for (let c = 0; c < SNOPS_FEATURE_COUNT; c++){
        data[i * SNOPS_FEATURE_COUNT * SNOPS_WINDOW + c * SNOPS_WINDOW + w] = vec[c];
      }
    }
  }
  return { data, n: nFrames };
}

// Browsers have no Buffer; chunked to avoid a call-stack blowup on
// String.fromCharCode(...bytes) for large arrays.
function bufferToBase64(buffer){
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(binary);
}
// Inverse of the above -- decodes a base64 string straight back to a
// Float32Array, for the audio/spectrogram bytes the backend sends back.
function base64ToFloat32(base64Str){
  const binary = atob(base64Str);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Float32Array(bytes.buffer);
}

// Resolves once the <script type="module"> bootstrap earlier in the
// document has connected the Gradio client and assigned window.backendApp.
// Polls rather than sharing a promise across the module/classic script
// boundary (a classic script can't see a module's bindings) -- cheap since
// this only spins for the first fraction of a second after page load, not
// on every call once connected.
function waitForBackendApp(timeoutMs){
  timeoutMs = timeoutMs || 8000;
  if (window.backendApp) return Promise.resolve(window.backendApp);
  return new Promise((resolve, reject) => {
    const start = performance.now();
    (function poll(){
      if (window.backendApp) return resolve(window.backendApp);
      if (performance.now() - start > timeoutMs) return reject(new Error('Caviar client did not connect in time'));
      setTimeout(poll, 100);
    })();
  });
}

// ---- Caviar (Hugging Face Space) connection status -----------------------
// States: 'unknown' (not checked yet) | 'asleep' (space unreachable/cold) |
// 'loading' (space is up but /ping hasn't returned "ok" yet, including the
// local Gradio client still connecting) | 'ok'.
function setBackendStatus(status){
  state.aiBackendStatus = status;
  const dot = document.getElementById('backendDot');
  const label = document.getElementById('backendLabel');
  dot.classList.remove('ok', 'warn', 'err');
  if (status === 'ok'){ dot.classList.add('ok'); label.textContent = 'Caviar connected'; }
  else if (status === 'loading'){ dot.classList.add('warn'); label.textContent = 'Caviar loading\u2026'; }
  else if (status === 'asleep'){ dot.classList.add('err'); label.textContent = 'space asleep'; }
  else if (status === 'err'){ dot.classList.add('err'); label.textContent = 'backend error'; }
  else { label.textContent = 'backend not connected'; }
}

// Hugging Face Spaces sleep after inactivity and can take a while to cold
// boot, so this polls patiently rather than treating a failed ping as fatal.
// The server now loads every singer's weights at startup -- there's no
// separate /load step or "not loaded" state to react to -- so the only
// question /ping answers is a plain ok/not-ok: "ok" -> done, stop polling;
// anything else (e.g. "loading" while the server warms up) -> keep polling;
// the request itself failing (space asleep/unreachable, or the local Gradio
// client not connected yet) -> back off further and toast once, not per retry.
let pingRetryTimer = null;
let asleepToastShown = false;
let wasBackendConnected = false;
function clearPingRetry(){ if (pingRetryTimer){ clearTimeout(pingRetryTimer); pingRetryTimer = null; } }
function schedulePingRetry(ms){ clearPingRetry(); pingRetryTimer = setTimeout(() => pingCaviarBackend(), ms); }

async function pingCaviarBackend(){
  clearPingRetry();
  try{
    const app = await waitForBackendApp(1500);
    const response = await app.predict('/ping', []);
    const text = String(response.data[0]).trim().toLowerCase();
    if (text === 'ok'){
      asleepToastShown = false;
      setBackendStatus('ok');
      if (!wasBackendConnected) toast('Caviar is ready.');
      wasBackendConnected = true;
    } else {
      setBackendStatus('loading');
      wasBackendConnected = false;
      schedulePingRetry(3000);
    }
  } catch (e){
    setBackendStatus('asleep');
    wasBackendConnected = false;
    if (!asleepToastShown){
      toast('Backend space looks asleep -- checking again every 15s.', true);
      asleepToastShown = true;
    }
    schedulePingRetry(15000);
  }
}

// =========================================================================
// Singers -- pluggable per-track audio renderers.
//
// Every singer implements the same contract:
//   async render(track, startIdx, endIdx) -> Float32Array of PCM at
//   `this.sampleRate`, covering 80fps frame indices [startIdx, endIdx).
// Passing (track, startIdx, endIdx) rather than pre-built frames lets each
// singer decide its own context needs -- Sinnie/NoSinger only need the
// frames in range, but BackendSinger additionally needs +/-6 frames of
// padding on each side for PimpSpec's sliding window, which it fetches
// itself via buildSnOpsWindowBatch().
// =========================================================================

// Returns pure silence. The honest default for "no voice connected."
class NoSinger {
  constructor(){ this.sampleRate = 24000; }
  async render(track, startIdx, endIdx){
    return new Float32Array(Math.round(Math.max(0, endIdx - startIdx) / SAMPLE_RATE_HZ * this.sampleRate));
  }
}

// A plain sine-tone voice so there's something audible without any backend.
// Pitch is already the raw MIDI number (Pitch curve + vibrato baked in by
// buildSnOpsFrames), so it converts to Hz directly -- no un-normalizing
// needed. Steps a phase accumulator sample-by-sample so frequency/power
// changes between 80fps frames don't click: phase carries over continuously
// rather than resetting each frame, and both Hz and power are linearly
// interpolated between adjacent frame centers. Power=0 during silence
// zeroes the output directly, no separate fade logic needed.
class SinnieSinger {
  constructor(){ this.sampleRate = 24000; }
  async render(track, startIdx, endIdx){
    const frames = buildSnOpsFrames(track, startIdx, endIdx);
    const n = frames.length;
    const out = new Float32Array(Math.round(n / SAMPLE_RATE_HZ * this.sampleRate));
    if (n === 0) return out;
    const hzOf = (f) => 440 * Math.pow(2, (f.pitch - 69) / 12);
    const samplesPerFrame = this.sampleRate / SAMPLE_RATE_HZ;
    let phase = 0;
    for (let i = 0; i < out.length; i++){
      const pos = i / samplesPerFrame;
      const f0 = Math.min(n - 1, Math.floor(pos));
      const f1 = Math.min(n - 1, f0 + 1);
      const t = pos - f0;
      const hz = lerp(hzOf(frames[f0]), hzOf(frames[f1]), t);
      const power = lerp(frames[f0].power, frames[f1].power, t);
      phase += (2 * Math.PI * hz) / this.sampleRate;
      if (phase > Math.PI * 2) phase -= Math.PI * 2;
      out[i] = Math.sin(phase) * power * 0.6;
    }
    return out;
  }
}

// Calls a PimpSpec+Vocoder pair hosted as a Hugging Face Space, through the
// Gradio JS client (window.backendApp, connected by the <script
// type="module"> bootstrap earlier in the document) rather than raw fetch.
// One "/inferpls" call does the whole job server-side now -- SnOps in,
// {spectrogram, audio} out -- so there's no separate pimp/vocor call pair or
// frame-major->mel-major transpose to do on this end anymore, and no /load
// step: the server loads every registered singer's weights at boot, and
// each request carries its own SingerName, so multiple singers on the same
// space are already safe to mix per-track without any global "which weights
// are active" race. Generic on purpose -- constructed with just a
// singerName so future singers on this same architecture/space are just
// another registry entry, not a new class.
class BackendSinger {
  constructor(opts){
    this.singerName = opts.singerName;
    this.sampleRate = 24000;
  }

  async render(track, startIdx, endIdx){
    try{
      const { data, n } = buildSnOpsWindowBatch(track, startIdx, endIdx);
      if (n === 0) return new Float32Array(0);
      const app = await waitForBackendApp();
      const base64SnOps = bufferToBase64(data.buffer);
      const response = await fetch("https://syncaviarbackendproxy-production.up.railway.app/api/inferpls", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({base64SnOps: base64SnOps, singerName: this.singerName})
        });

      const result = await response.json();
      // response.data[0] is the mel spectrogram -- debugging only, never
      // shown to the user. response.data[1] is the final rendered PCM audio,
      // already fully assembled server-side at the exact expected length.
      const audio = base64ToFloat32(result.data[1]);
      setBackendStatus('ok');
      wasBackendConnected = true;
      return audio;
    } catch (e){
      setBackendStatus('asleep');
      console.log("error: ", e);
      wasBackendConnected = false;
      schedulePingRetry(15000);
      return new NoSinger().render(track, startIdx, endIdx);
    }
  }
}

// Playback: renders every track to PCM, mixes them with the Web Audio API,
// and drives a playhead across the Piano Roll / Note Wave / Track Editor.
//
// APPROACH: per-track PCM is cached on the track itself (track._pcm) and
// only re-synthesized when THAT track's notes/curves/singer change
// (markTrackDirty). The final mix (masterBuffer) is cheap by comparison --
// just gain nodes + copying via OfflineAudioContext -- so it re-runs
// whenever any track's cache changes OR a mix-level param (mute/solo/
// volume) does (markMixDirty), even though no re-synthesis was needed.
// Both run in the background as edits happen (schedulePrerender, debounced),
// so by the time Play is pressed, ensureMasterRendered() usually just
// returns the already-current buffer instead of computing anything.
// =========================================================================
let playheadSec = 0;
let isPlaying = false;
let playbackCtx = null;
let playbackSource = null;
let playbackStartCtxTime = 0;
let playbackStartOffset = 0;
let isRendering = false;
let masterBuffer = null;
let masterDirty = true;
let prerenderScheduled = false;

function resizeFloat32(arr, len){
  if (arr.length === len) return arr;
  if (arr.length > len) return arr.slice(0, len);
  const grown = new Float32Array(len);
  grown.set(arr);
  return grown;
}

// Renders exactly one dirty-range pass for a track. `rangeSnapshot` is
// either 'full' (whole track -- first render, singer/BPM changed) or
// {start,end} in 80fps frame indices (an edited region). For a partial
// range, only that region (+/- SNOPS_WINDOW_HALF for the model's own
// context) is sent to the singer, and the result is spliced into the
// existing cached buffer at the matching sample offset -- everything
// outside the edited region is untouched, so this doesn't get slower as
// the track gets longer, only as the *edited region* gets longer.
async function renderTrackPcmRange(track, rangeSnapshot){
  try{
    if (track.type === 'synth'){
      const singer = createSinger(track.singerId);
      const totalEndIdx = Math.max(0, Math.ceil(beatsToSeconds(trackEndBeats(track)) * SAMPLE_RATE_HZ) + SNOPS_WINDOW_HALF);
      const totalSamples = Math.round(totalEndIdx / SAMPLE_RATE_HZ * singer.sampleRate);
      const needsFull = rangeSnapshot === 'full' || !track._pcm || track._pcm.sampleRate !== singer.sampleRate;

      if (needsFull){
        track._pcm = { data: totalEndIdx > 0 ? await singer.render(track, 0, totalEndIdx) : new Float32Array(0), sampleRate: singer.sampleRate };
        return;
      }
      let base = resizeFloat32(track._pcm.data, totalSamples); // also handles the track having shrunk/grown overall
      const pad = SNOPS_WINDOW_HALF;
      const rStart = Math.max(0, rangeSnapshot.start - pad);
      const rEnd = rangeSnapshot.end + pad;
      if (rEnd > rStart){
        const patch = await singer.render(track, rStart, rEnd);
        const patchStartSample = Math.round(rStart / SAMPLE_RATE_HZ * singer.sampleRate);
        if (patchStartSample + patch.length > base.length) base = resizeFloat32(base, patchStartSample + patch.length);
        base.set(patch, patchStartSample);
      }
      track._pcm = { data: base, sampleRate: singer.sampleRate };
    } else if (track.type === 'audio' && track.objectUrl){
      const resp = await fetch(track.objectUrl);
      const arr = await resp.arrayBuffer();
      const probeCtx = new OfflineAudioContext(1, 1, 44100);
      const buf = await probeCtx.decodeAudioData(arr);
      track._pcm = { data: buf.getChannelData(0), sampleRate: buf.sampleRate };
    } else if (!track._pcm){
      track._pcm = { data: new Float32Array(0), sampleRate: 24000 };
    }
  } catch (e){
    if (!track._pcm) track._pcm = { data: new Float32Array(0), sampleRate: 24000 };
  }
}

// De-duplicates concurrent calls for the same track (edits that land while a
// render is already in flight don't start a second overlapping fetch to
// Caviar) using a generation counter: if a new dirty-mark arrives *during*
// a render, the generation bumps, so the loop below notices and renders
// again afterward rather than either racing or silently dropping the edit.
async function ensureTrackPcm(track){
  while (track._pcmDirty || !track._pcm){
    if (track._renderInFlight){ await track._renderInFlight; continue; }
    const myGeneration = track._pcmGeneration || 0;
    const rangeSnapshot = track._dirtyRange || 'full';
    track._renderInFlight = renderTrackPcmRange(track, rangeSnapshot).finally(() => { track._renderInFlight = null; });
    await track._renderInFlight;
    if ((track._pcmGeneration || 0) === myGeneration){
      track._pcmDirty = false;
      track._dirtyRange = null;
    }
    // else: something was marked dirty again while we were rendering -- loop and pick it up.
  }
}

// Converts a beat range (how notes are stored) to an 80fps frame-index
// range (how dirty regions and rendering are tracked).
function beatsRangeToFrameRange(startBeat, endBeat){
  const start = Math.max(0, Math.floor(beatsToSeconds(startBeat) * SAMPLE_RATE_HZ));
  const end = Math.max(start, Math.ceil(beatsToSeconds(endBeat) * SAMPLE_RATE_HZ));
  return { start, end };
}

// Marks only a specific frame-index region dirty (the common case -- most
// edits touch one note or one stroke, not the whole track). Ranges
// accumulate (union) across multiple calls before a render actually runs,
// so a burst of small edits still only re-renders their combined span.
function markTrackRangeDirty(track, startIdx, endIdx){
  startIdx = Math.max(0, startIdx);
  endIdx = Math.max(startIdx, endIdx);
  if (track._dirtyRange === 'full'){ /* already rendering everything this pass */ }
  else if (!track._dirtyRange) track._dirtyRange = { start: startIdx, end: endIdx };
  else {
    track._dirtyRange.start = Math.min(track._dirtyRange.start, startIdx);
    track._dirtyRange.end = Math.max(track._dirtyRange.end, endIdx);
  }
  track._pcmDirty = true;
  track._pcmGeneration = (track._pcmGeneration || 0) + 1;
  masterDirty = true;
  schedulePrerender();
}
// Marks the whole track dirty -- for changes with no single localized
// region: singer swap, BPM change (shifts every note's timing), first render.
function markTrackDirty(track){
  track._dirtyRange = 'full';
  track._pcmDirty = true;
  track._pcmGeneration = (track._pcmGeneration || 0) + 1;
  masterDirty = true;
  schedulePrerender();
}
function markMixDirty(){
  masterDirty = true;
  schedulePrerender();
}

// Marks just one note's own [start, end) dirty -- for edits that don't move
// the note itself (lyric, vibrato), so only its own frames get re-rendered.
function onNoteFieldEditCommitted(track, note){
  const { start, end } = beatsRangeToFrameRange(note.start, note.end);
  markTrackRangeDirty(track, start, end);
}

// Turns a finished Piano Roll interaction (move/resize/pencil-draw/erasing)
// into the smallest frame-index range that actually needs re-rendering: the
// union of wherever the affected note(s) were *and* wherever they ended up,
// since both the vacated region and the new one need fresh audio.
function markDirtyForInteractionCommit(track, inter){
  let lo = Infinity, hi = -Infinity;
  const extend = (a, b) => { lo = Math.min(lo, a, b); hi = Math.max(hi, a, b); };
  if (inter.type === 'move'){
    inter.startPositions.forEach((orig, id) => {
      extend(orig.start, orig.end);
      const n = track.notes.find(nn => nn.id === id);
      if (n) extend(n.start, n.end);
    });
  } else if (inter.type === 'resize'){
    extend(inter.origStart, inter.origEnd);
    extend(inter.note.start, inter.note.end);
  } else if (inter.type === 'pencil-draw'){
    extend(inter.note.start, inter.note.end);
  } else if (inter.type === 'erasing'){
    (inter.erasedRanges || []).forEach(r => extend(r.start, r.end));
  }
  if (!isFinite(lo) || !isFinite(hi)) return; // e.g. an eraser drag that never actually hit a note
  const { start, end } = beatsRangeToFrameRange(lo, hi);
  markTrackRangeDirty(track, start, end);
}
function schedulePrerender(){
  if (prerenderScheduled) return;
  prerenderScheduled = true;
  // Debounced so a burst of edits collapses into one background render
  // instead of re-rendering after every single change in the burst.
  setTimeout(() => { prerenderScheduled = false; ensureMasterRendered().catch(() => {}); }, 150);
}

async function ensureMasterRendered(){
  await Promise.all(state.tracks.map(ensureTrackPcm));
  if (!masterDirty && masterBuffer) return masterBuffer;
  const targetRate = 24000;
  let totalSec = 0.1;
  state.tracks.forEach(t => { if (t._pcm) totalSec = Math.max(totalSec, t._pcm.data.length / t._pcm.sampleRate); });
  const offlineCtx = new OfflineAudioContext(2, Math.ceil(totalSec * targetRate) + 1, targetRate);
  const anySolo = state.tracks.some(t => t.solo);
  state.tracks.forEach(t => {
    if (t.muted) return;
    if (anySolo && !t.solo) return;
    if (!t._pcm || !t._pcm.data.length) return;
    const buf = offlineCtx.createBuffer(1, t._pcm.data.length, t._pcm.sampleRate);
    buf.copyToChannel(t._pcm.data, 0);
    const src = offlineCtx.createBufferSource();
    src.buffer = buf;
    const gain = offlineCtx.createGain();
    gain.gain.value = t.volume;
    src.connect(gain).connect(offlineCtx.destination);
    src.start(0);
  });
  masterBuffer = await offlineCtx.startRendering();
  masterDirty = false;
  return masterBuffer;
}

// Encodes an AudioBuffer as a 16-bit PCM WAV Blob -- just a standard 44-byte
// RIFF/WAVE header followed by interleaved samples, no library needed.
function audioBufferToWavBlob(buffer){
  const numChannels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const numFrames = buffer.length;
  const blockAlign = numChannels * 2; // 16-bit samples
  const dataSize = numFrames * blockAlign;
  const out = new ArrayBuffer(44 + dataSize);
  const view = new DataView(out);
  const writeStr = (offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };

  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);              // fmt chunk size
  view.setUint16(20, 1, true);                // PCM
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * blockAlign, true); // byte rate
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, 16, true);                // bits per sample
  writeStr(36, 'data');
  view.setUint32(40, dataSize, true);

  const channelData = [];
  for (let c = 0; c < numChannels; c++) channelData.push(buffer.getChannelData(c));
  let offset = 44;
  for (let i = 0; i < numFrames; i++){
    for (let c = 0; c < numChannels; c++){
      const s = clamp(channelData[c][i], -1, 1);
      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      offset += 2;
    }
  }
  return new Blob([out], { type: 'audio/wav' });
}

async function exportMixAsWav(){
  toast('Rendering mix for export\u2026');
  let buffer;
  try{
    buffer = await ensureMasterRendered();
  } catch (e){
    toast('Could not render the mix to export.', true);
    return;
  }
  const blob = audioBufferToWavBlob(buffer);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'mix.wav';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('Exported ' + a.download);
}

function updateTransportUI(){
  const btn = document.getElementById('playBtn');
  if (!btn) return;
  btn.textContent = isPlaying ? '\u25a0' : (isRendering ? '\u2026' : '\u25b6');
  btn.title = isPlaying ? 'Stop' : 'Play';
  btn.disabled = isRendering;
}

async function startPlayback(){
  if (isPlaying || isRendering) return;
  isRendering = true; updateTransportUI();
  let buffer;
  try{
    buffer = await ensureMasterRendered();
  } catch (e){
    isRendering = false; updateTransportUI();
    toast('Could not render audio for playback.', true);
    return;
  }
  isRendering = false;
  playbackCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = playbackCtx.createBufferSource();
  src.buffer = buffer;
  src.connect(playbackCtx.destination);
  const startAt = clamp(playheadSec, 0, buffer.duration);
  src.start(0, startAt);
  src.onended = () => { if (isPlaying){ isPlaying = false; playheadSec = 0; updateTransportUI(); renderPianoRoll(); renderNoteWave(); renderTrackContent(); } };
  playbackSource = src;
  playbackStartCtxTime = playbackCtx.currentTime;
  playbackStartOffset = startAt;
  isPlaying = true;
  updateTransportUI();
  requestAnimationFrame(tickPlayhead);
}

function stopPlayback(){
  if (playbackSource){ try{ playbackSource.onended = null; playbackSource.stop(); } catch (e){} playbackSource = null; }
  if (playbackCtx){ playbackCtx.close(); playbackCtx = null; }
  isPlaying = false;
  updateTransportUI();
}

function tickPlayhead(){
  if (!isPlaying || !playbackCtx) return;
  playheadSec = playbackStartOffset + (playbackCtx.currentTime - playbackStartCtxTime);
  renderPianoRoll(); renderNoteWave(); renderTrackContent();
  requestAnimationFrame(tickPlayhead);
}

function togglePlayback(){ isPlaying ? stopPlayback() : startPlayback(); }

// Lightweight position update for dragging the playhead (no audio-context
// churn on every pointermove); the drag helpers below wrap it with a
// stop-before/restart-after only at the start and end of a drag.
function setPlayheadPosition(sec){
  playheadSec = Math.max(0, sec);
  renderPianoRoll(); renderNoteWave(); renderTrackContent();
}
let seekDragActive = false;
let seekDragWasPlaying = false;
function startSeekDrag(sec){
  seekDragActive = true;
  seekDragWasPlaying = isPlaying;
  if (isPlaying) stopPlayback();
  setPlayheadPosition(sec);
}
function continueSeekDrag(sec){ if (seekDragActive) setPlayheadPosition(sec); }
function endSeekDrag(){
  if (!seekDragActive) return;
  seekDragActive = false;
  if (seekDragWasPlaying) startPlayback();
}
function seekTo(sec){ startSeekDrag(sec); endSeekDrag(); }
function rewindPlayhead(){ seekTo(0); }

function drawPlayheadLine(ctx, screenX, widthCss, heightCss){
  if (screenX < -2 || screenX > widthCss + 2) return;
  ctx.strokeStyle = PALETTE.playhead;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(Math.round(screenX) + 0.5, 0); ctx.lineTo(Math.round(screenX) + 0.5, heightCss); ctx.stroke();
  ctx.fillStyle = PALETTE.playhead;
  ctx.beginPath();
  ctx.moveTo(screenX - 4, 0); ctx.lineTo(screenX + 4, 0); ctx.lineTo(screenX, 6); ctx.closePath(); ctx.fill();
}

// A .scv file is plain JSON under a different extension -- kept deliberately
// simple per the brief. Audio-track file bytes are not embedded; re-import
// the same file after loading if a project used one.
function serializeCurve(arr){
  const obj = {};
  arr.forEach((v, i) => { if (v !== undefined) obj[i] = Math.round(v * 1000) / 1000; });
  return obj;
}
function deserializeCurve(obj){
  const arr = [];
  if (obj) Object.keys(obj).forEach(k => { arr[parseInt(k, 10)] = obj[k]; });
  return arr;
}

function serializeProject(){
  return {
    formatVersion: 2,
    bpm: state.bpm,
    currentTrackId: state.currentTrackId,
    tracks: state.tracks.map(t => t.type === 'synth' ? ({
      id: t.id, type: 'synth', name: t.name, singerId: t.singerId,
      volume: t.volume, muted: t.muted, solo: t.solo,
      notes: t.notes.map(n => ({ id:n.id, start:n.start, end:n.end, pitch:n.pitch, lyric:n.lyric, vibrato:n.vibrato })),
      pitchCurve: serializeCurve(t.pitchCurve),
      powerCurve: serializeCurve(t.powerCurve),
    }) : ({
      id: t.id, type: 'audio', name: t.name, fileName: t.fileName,
      durationSec: t.durationSec, volume: t.volume, muted: t.muted, solo: t.solo,
    })),
  };
}

function deserializeProject(json){
  const tracks = (json.tracks || []).map(t => {
    if (t.type === 'audio'){
      return { id: t.id || nextId('track'), type:'audio', name: t.name || 'Audio', fileName: t.fileName || '',
        durationSec: t.durationSec || 0, objectUrl: null, volume: t.volume ?? 1, muted: !!t.muted, solo: !!t.solo };
    }
    return {
      id: t.id || nextId('track'), type: 'synth', name: t.name || 'Track',
      singerId: SINGER_REGISTRY[t.singerId] ? t.singerId : 'sinnie',
      volume: t.volume ?? 1, muted: !!t.muted, solo: !!t.solo,
      notes: (t.notes || []).map(n => ({
        id: n.id || nextId('note'), start: n.start, end: n.end, pitch: n.pitch, lyric: n.lyric || '',
        disabled: false, overlapping: false, vibrato: Object.assign(makeDefaultVibrato(), n.vibrato || {}),
      })),
      pitchCurve: deserializeCurve(t.pitchCurve),
      powerCurve: deserializeCurve(t.powerCurve),
    };
  });
  if (tracks.length === 0) tracks.push(makeSynthTrack('Track 1', 'sinnie'));
  state.tracks = tracks;
  state.bpm = json.bpm || 120;
  state.currentTrackId = tracks.some(t => t.id === json.currentTrackId) ? json.currentTrackId : tracks[0].id;
  state.selectedNoteIds = new Set();
  state.activeNoteId = null;
  tracks.forEach(t => recomputeOverlaps(t));
  markMixDirty();
}

function saveProjectToFile(){
  const data = JSON.stringify(serializeProject());
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'project.scv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('Saved project.scv');
}

const loadFileInput = document.getElementById('loadFileInput');
function openProjectFromDisk(){ loadFileInput.click(); }
loadFileInput.addEventListener('change', () => {
  const file = loadFileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      deserializeProject(JSON.parse(reader.result));
      bpmInputRef().value = state.bpm;
      renderTrackEditorRows(); renderPianoRoll(); renderNoteWave(); renderNoteProperties();
      toast('Loaded "' + file.name + '".');
    } catch (e){
      toast('That file could not be read as a SynCaviar project.', true);
    }
  };
  reader.readAsText(file);
  loadFileInput.value = '';
});

function newProject(){
  showModal('Start a new project?', 'Any unsaved changes to the current project will be lost.', [
    { label:'Cancel', onClick:() => {} },
    { label:'New project', primary:true, onClick:() => {
      initDefaultProject();
      bpmInputRef().value = state.bpm;
      renderTrackEditorRows(); renderPianoRoll(); renderNoteWave(); renderNoteProperties();
    }},
  ]);
}
function bpmInputRef(){ return document.getElementById('bpmInput'); }

document.querySelectorAll('.menu-item').forEach(item => {
  item.querySelector('.menu-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    const wasOpen = item.classList.contains('open');
    document.querySelectorAll('.menu-item.open').forEach(i => i.classList.remove('open'));
    if (!wasOpen) item.classList.add('open');
  });
});
window.addEventListener('click', () => document.querySelectorAll('.menu-item.open').forEach(i => i.classList.remove('open')));

function showAboutModal(){
  showModal('About SynCaviar',
    'A frontend prototype for a singing-synthesis DAW: a Track Editor, Piano Roll, Note Properties panel and a Pitch/Power wave editor, wired up to call a local AI backend for rendering.',
    [{ label:'Close', primary:true, onClick:() => {} }]);
}

document.getElementById('menuNew').addEventListener('click', newProject);
document.getElementById('menuOpen').addEventListener('click', openProjectFromDisk);
document.getElementById('menuSave').addEventListener('click', saveProjectToFile);
document.getElementById('menuExportWav').addEventListener('click', exportMixAsWav);
document.getElementById('menuAbout').addEventListener('click', showAboutModal);
document.getElementById('menuBackend').addEventListener('click', async () => {
  await pingCaviarBackend();
  const statusText = {
    ok: 'Connected to Caviar (' + CAVIAR_SPACE_ID + ').',
    loading: 'Space is awake and Caviar is loading -- this can take a moment on a cold start.',
    asleep: 'The space at ' + CAVIAR_SPACE_ID + ' looks asleep (Hugging Face Spaces sleep after inactivity). Retrying automatically every 15s.',
    err: 'The space responded unexpectedly. Retrying automatically.',
    unknown: 'Haven\u2019t checked yet.',
  }[state.aiBackendStatus] || 'Unknown status.';
  showModal('Caviar backend', statusText, [{ label:'Close', primary:true, onClick:() => {} }]);
});
document.getElementById('pingBackendBtn').addEventListener('click', () => pingCaviarBackend());

const bpmInput = document.getElementById('bpmInput');
bpmInput.addEventListener('change', () => {
  const v = parseFloat(bpmInput.value);
  if (!isNaN(v) && v > 0){
    const newBpm = clamp(v, 20, 400);
    if (newBpm !== state.bpm){
      // Notes are beat-indexed so they move in time on their own; the
      // pitch/power curves are frame-indexed (real time) so they need an
      // explicit stretch to stay lined up with those notes.
      const ratio = state.bpm / newBpm;
      state.tracks.forEach(t => {
        if (t.type !== 'synth') return;
        t.pitchCurve = rescaleCurve(t.pitchCurve, ratio);
        t.powerCurve = rescaleCurve(t.powerCurve, ratio);
      });
      state.bpm = newBpm;
    }
  }
  bpmInput.value = state.bpm;
  state.tracks.forEach(t => { if (t.type === 'synth') markTrackDirty(t); });
  renderTrackEditorRows(); renderPianoRoll(); renderNoteWave();
});

document.getElementById('playBtn').addEventListener('click', togglePlayback);
document.getElementById('rewindBtn').addEventListener('click', rewindPlayhead);

const splashEl = document.getElementById('splash');
const splashPanelEl = document.getElementById('splashPanel');
function dismissSplash(){ splashEl.classList.add('hidden'); }
function showSplash(){ splashEl.classList.remove('hidden'); }
// Clicking the dimmed backdrop closes the splash (like Blender's); clicking
// inside the floating panel itself must not bubble up and trigger that.
splashEl.addEventListener('click', dismissSplash);
splashPanelEl.addEventListener('click', (e) => e.stopPropagation());
document.getElementById('brandLogo').addEventListener('click', showSplash);

document.getElementById('splashNew').addEventListener('click', () => {
  initDefaultProject();
  bpmInput.value = state.bpm;
  renderTrackEditorRows(); renderPianoRoll(); renderNoteWave(); renderNoteProperties();
  dismissSplash();
});
document.getElementById('splashOpen').addEventListener('click', () => { dismissSplash(); openProjectFromDisk(); });
document.getElementById('splashAbout').addEventListener('click', showAboutModal);

function makeVerticalResizer(handle, panel, opts){
  let dragging = false, startY = 0, startH = 0;
  handle.addEventListener('pointerdown', (e) => {
    dragging = true; startY = e.clientY; startH = panel.getBoundingClientRect().height;
    handle.setPointerCapture(e.pointerId); handle.classList.add('active');
  });
  handle.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const h = clamp(startH + (e.clientY - startY) * (opts.invert ? -1 : 1), opts.min || 80, opts.max || 900);
    panel.style.flex = '0 0 ' + h + 'px';
  });
  handle.addEventListener('pointerup', () => { dragging = false; handle.classList.remove('active'); });
}
function makeHorizontalResizer(handle, panel, opts){
  let dragging = false, startX = 0, startW = 0;
  handle.addEventListener('pointerdown', (e) => {
    dragging = true; startX = e.clientX; startW = panel.getBoundingClientRect().width;
    handle.setPointerCapture(e.pointerId); handle.classList.add('active');
  });
  handle.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const w = clamp(startW + (e.clientX - startX) * (opts.invert ? -1 : 1), opts.min || 160, opts.max || 700);
    panel.style.flex = '0 0 ' + w + 'px';
  });
  handle.addEventListener('pointerup', () => { dragging = false; handle.classList.remove('active'); });
}

makeVerticalResizer(document.getElementById('resizerTop'), document.getElementById('trackEditorPanel'), { min:120, max:520, invert:false });
makeVerticalResizer(document.getElementById('resizerBottom'), document.getElementById('noteWaveEditorPanel'), { min:90, max:420, invert:true });
makeHorizontalResizer(document.getElementById('resizerMid'), document.getElementById('notePropertiesPanel'), { min:210, max:520, invert:true });

initDefaultProject();
bpmInput.value = state.bpm;
renderTrackEditorRows();
renderPianoRoll();
renderNoteWave();
renderNoteProperties();
setBackendStatus('unknown');
pingCaviarBackend();
updateTransportUI();
ensureMasterRendered().catch(() => {}); // start rendering immediately, don't wait for the debounce

</script>
