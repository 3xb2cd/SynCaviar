<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<title>SynCaviar</title>
<style>
  :root{
    --bg:            #0e0f12;
    --surface:       #17191e;
    --surface-alt:   #1d2027;
    --surface-raised:#22252d;
    --border:        #2b2e36;
    --border-soft:   #23262d;
    --text:          #e9e6df;
    --text-dim:      #9b9ca3;
    --text-faint:    #5d6068;
    --accent:        #c8425c;
    --accent-dim:    #7a3140;
    --accent-soft:   rgba(200,66,92,0.16);
    --gold:          #d3a24a;
    --gold-dim:      rgba(211,162,74,0.18);
    --key-white:     #eae7e0;
    --key-black:     #18191c;
    --grid-line:     #33363e;
    --grid-line-soft:#2a2c33;
    --danger:        #c8425c;
    --ok:            #6fae7f;
    --radius-sm: 5px;
    --radius-md: 9px;
    --radius-pill: 999px;
    --mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
    --sans: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @font-face{
    /* Falls back silently to the --sans / --mono stacks above if offline */
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); color:var(--text);
    font-family:var(--sans);
    font-size:13px;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  ::selection{ background:var(--accent-soft); }
  button, input{ font-family:inherit; color:inherit; }
  button{
    background:var(--surface-raised);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:var(--radius-sm);
    padding:5px 10px;
    font-size:12px;
    cursor:pointer;
    transition:background .12s ease, border-color .12s ease;
  }
  button:hover{ background:#282b34; border-color:#3a3d47; }
  button:active{ background:#25272f; }
  button.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover{ background:#d4576f; }
  button:disabled{ opacity:.4; cursor:default; }
  input[type="text"], input[type="number"]{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:4px 7px; font-size:12px; color:var(--text);
  }
  input[type="text"]:focus, input[type="number"]:focus{ outline:1px solid var(--accent); border-color:var(--accent); }
  input[type="range"]{
    -webkit-appearance:none; appearance:none; height:3px; background:var(--border);
    border-radius:2px; width:100%;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:var(--gold); border:2px solid #0e0f12; margin-top:-5px; cursor:pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width:11px; height:11px; border-radius:50%; background:var(--gold); border:2px solid #0e0f12; cursor:pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track{ height:3px; background:var(--border); border-radius:2px; }
  a{ color:var(--gold); }

  /* ---------- App chrome ---------- */
  #menubar{
    height:34px; display:flex; align-items:center; gap:2px;
    background:var(--surface-alt); border-bottom:1px solid var(--border);
    padding:0 8px; position:relative; z-index:50;
  }
  #menubar .brand{
    display:flex; align-items:center; gap:7px; margin-right:10px; padding-right:10px;
    border-right:1px solid var(--border); cursor:pointer;
  }
  #menubar .brand-mark{
    width:16px; height:16px; border-radius:4px;
    background:radial-gradient(circle at 30% 30%, var(--gold), var(--accent) 70%);
    box-shadow:0 0 0 1px rgba(0,0,0,.3) inset;
  }
  #menubar .brand-name{ font-weight:700; letter-spacing:.2px; font-size:12.5px; }
  .menu-item{ position:relative; }
  .menu-btn{
    background:transparent; border:1px solid transparent; padding:5px 9px; font-size:12px; color:var(--text-dim);
  }
  .menu-btn:hover, .menu-item.open .menu-btn{ background:var(--surface-raised); color:var(--text); border-color:var(--border); }
  .menu-dropdown{
    position:absolute; top:calc(100% + 3px); left:0; min-width:170px;
    background:var(--surface-raised); border:1px solid var(--border); border-radius:var(--radius-sm);
    box-shadow:0 10px 24px rgba(0,0,0,.45); padding:4px; display:none; flex-direction:column; gap:1px;
  }
  .menu-item.open .menu-dropdown{ display:flex; }
  .menu-dropdown button{
    background:transparent; border:none; text-align:left; padding:6px 8px; border-radius:4px; font-size:12px;
    display:flex; justify-content:space-between; gap:14px;
  }
  .menu-dropdown button:hover{ background:var(--accent-soft); color:var(--text); }
  .menu-dropdown button .hint{ color:var(--text-faint); font-family:var(--mono); font-size:10.5px; }
  #menubar .spacer{ flex:1; }
  .transport{ display:flex; align-items:center; gap:10px; padding-right:4px; }
  .transport .field{ display:flex; align-items:center; gap:5px; color:var(--text-dim); font-size:11px; }
  .transport input[type="number"]{ width:52px; font-family:var(--mono); text-align:right; }
  .transport .status-dot{
    width:6px; height:6px; border-radius:50%; background:var(--text-faint); flex-shrink:0;
  }
  .transport .status-dot.warn{ background:var(--gold); }
  .transport .status-dot.err{ background:var(--danger); }
  .transport .status-dot.ok{ background:var(--ok); }

  /* ---------- Layout ---------- */
  #app{
    position:absolute; top:34px; left:0; right:0; bottom:0;
    display:flex; flex-direction:column;
  }
  .panel{
    background:var(--surface); position:relative; display:flex; flex-direction:column; overflow:hidden;
  }
  .panel-header{
    height:24px; flex:0 0 auto; display:flex; align-items:center; gap:8px;
    padding:0 10px; font-size:11px; color:var(--text-faint); letter-spacing:.2px;
    border-bottom:1px solid var(--border-soft); background:var(--surface-alt);
  }
  .panel-header .title{ color:var(--text-dim); font-weight:600; }
  .panel-header .subtitle{ color:var(--text-faint); font-family:var(--mono); }
  .panel-header .spacer{ flex:1; }
  .panel-body{ flex:1; position:relative; overflow:hidden; }

  #trackEditorPanel{ flex:0 0 258px; min-height:120px; border-bottom:1px solid var(--border); }
  .resizer{ flex:0 0 auto; background:var(--border-soft); z-index:20; }
  .resizer.horizontal{ height:5px; cursor:row-resize; }
  .resizer.vertical{ width:5px; cursor:col-resize; }
  .resizer:hover, .resizer.active{ background:var(--accent-dim); }
  #bottomRow{ flex:1 1 auto; display:flex; min-height:120px; }
  #leftColumn{
    flex:1 1 auto; display:flex; flex-direction:column; min-width:220px; min-height:0;
    border-right:1px solid var(--border);
  }
  #pianoRollPanel{ flex:1 1 auto; min-height:80px; }
  #notePropertiesPanel{ flex:0 0 272px; min-width:220px; }
  #noteWaveEditorPanel{ flex:0 0 190px; min-height:90px; border-top:1px solid var(--border); }

  /* ---------- Track Editor ---------- */
  #trackEditorBody{ display:flex; height:100%; }
  #trackSidebar{
    width:280px; flex:0 0 280px; overflow-y:auto; overflow-x:hidden; border-right:1px solid var(--border);
    background:var(--surface);
  }
  #trackSidebar::-webkit-scrollbar{ width:8px; }
  #trackSidebar::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
  .track-row{
    height:96px; display:flex; align-items:stretch; border-bottom:1px solid var(--border-soft);
    position:relative; cursor:pointer;
  }
  .track-row:hover{ background:#1b1e25; }
  .track-row.selected{ background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent); }
  .track-row .track-icon{
    width:64px; flex:0 0 64px; margin:10px; border-radius:var(--radius-md);
    display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
    font-weight:700; font-size:18px; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.4);
  }
  .track-row .track-icon.audio-icon{ background:var(--surface-raised); color:var(--gold); font-size:20px; }
  .track-row .track-icon-pfp{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:inherit;
  }
  .track-row .track-main{ flex:1; min-width:0; padding:9px 8px 8px 0; display:flex; flex-direction:column; gap:5px; }
  .track-row .track-name{
    background:transparent; border:1px solid transparent; padding:1px 3px; font-size:12.5px; font-weight:600;
    width:100%; border-radius:3px;
  }
  .track-row .track-name:hover{ border-color:var(--border); }
  .track-row .track-name:focus{ background:var(--surface); border-color:var(--accent); outline:none; }
  .track-row .track-type{ font-size:10px; color:var(--text-faint); font-family:var(--mono); }
  .track-row .track-controls{ display:flex; align-items:center; gap:5px; margin-top:auto; flex-wrap:wrap; row-gap:4px; }
  .mini-btn{
    padding:3px 7px; font-size:10.5px; font-weight:700; line-height:1; border-radius:4px;
  }
  .mini-btn.mute.active{ background:var(--danger); border-color:var(--danger); color:#fff; }
  .mini-btn.solo.active{ background:var(--gold); border-color:var(--gold); color:#1a1200; }
  .knob{ width:26px; height:26px; border-radius:50%; position:relative; cursor:ns-resize; flex:0 0 auto; margin-left:4px; }
  .knob svg{ width:100%; height:100%; display:block; pointer-events:none; }
  .knob-label{ font-size:9px; color:var(--text-faint); font-family:var(--mono); }
  .track-row .track-remove{
    position:absolute; top:4px; right:4px; width:16px; height:16px; padding:0; border:none; background:transparent;
    color:var(--text-faint); font-size:13px; line-height:1; display:flex; align-items:center; justify-content:center;
  }
  .track-row .track-remove:hover{ color:var(--danger); background:transparent; }
  #trackAddRow{ display:flex; flex-direction:column; }
  .add-track-btn{
    height:48px; flex:1; background:var(--surface); border:none; border-bottom:1px dashed var(--border-soft);
    color:var(--text-faint); display:flex; align-items:center; justify-content:center; gap:6px; font-size:12px;
    border-radius:0;
  }
  .add-track-btn:last-child{ border-bottom:none; }
  .add-track-btn:hover{ background:#1b1e25; color:var(--text); }
  .add-track-btn .plus{ font-size:15px; color:var(--gold); }

  #trackContentWrap{ flex:1; position:relative; overflow:hidden; }
  #trackRulerCanvas{ position:absolute; top:0; left:0; width:100%; height:22px; display:block; z-index:2; }
  #trackRowsScroll{
    position:absolute; top:22px; left:0; right:0; bottom:0; overflow-y:hidden; overflow-x:hidden;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  #trackRowsScroll::-webkit-scrollbar{ display:none; }
  #trackRowsCanvas{ display:block; width:100%; }

  /* ---------- Piano Roll ---------- */
  #pianoRulerCanvas{
    position:absolute; top:0; left:75px; width:calc(100% - 75px); height:20px; display:block; z-index:2;
    cursor:pointer;
  }
  #pianoRollCanvas{ position:absolute; top:20px; left:0; width:100%; height:calc(100% - 20px); display:block; }
  .panel-overlay-title{
    position:absolute; top:24px; left:82px; z-index:5; pointer-events:none;
    color:var(--text-faint); font-size:11px; letter-spacing:.2px;
  }
  .panel-overlay-title .track-tag{ color:var(--gold); font-weight:600; }

  .floating-toolbar{
    position:absolute; top:50%; right:12px; transform:translateY(-50%); z-index:10;
    background:rgba(29,32,39,.88); backdrop-filter:blur(6px);
    border:1px solid var(--border); border-radius:var(--radius-pill);
    padding:6px; display:flex; flex-direction:column; gap:4px;
    box-shadow:0 8px 22px rgba(0,0,0,.45);
  }
  .tool-btn{
    width:32px; height:32px; border-radius:50%; border:1px solid transparent; background:transparent;
    display:flex; align-items:center; justify-content:center; padding:0; position:relative;
  }
  .tool-btn svg{ width:16px; height:16px; stroke:var(--text-dim); fill:none; }
  .tool-btn:hover{ background:var(--surface-raised); }
  .tool-btn.active{ background:var(--accent); }
  .tool-btn.active svg{ stroke:#fff; }
  .tool-btn.toggle.active{ background:var(--gold); }
  .tool-btn.toggle.active svg{ stroke:#1a1200; }
  .tool-btn .key-hint{
    position:absolute; bottom:-1px; right:-1px; font-size:7px; font-family:var(--mono); color:var(--text-faint);
    background:var(--surface); border-radius:3px; padding:0 2px; line-height:1.3;
  }
  .tool-divider{ height:1px; background:var(--border); margin:2px 4px; }

  /* ---------- Note Properties ---------- */
  #notePropertiesBody{ padding:14px 16px; overflow-y:auto; height:100%; }
  #notePropertiesBody::-webkit-scrollbar{ width:8px; }
  #notePropertiesBody::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
  .np-empty{ color:var(--text-faint); font-size:12px; padding-top:30%; text-align:center; }
  .np-group{ margin-bottom:16px; }
  .np-group-label{
    font-size:10px; text-transform:none; color:var(--text-faint); font-family:var(--mono);
    margin-bottom:8px; display:block; letter-spacing:.3px;
  }
  .np-row{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .np-row label{ width:78px; flex:0 0 78px; font-size:11.5px; color:var(--text-dim); }
  .np-row .np-value{ width:44px; flex:0 0 44px; text-align:right; font-family:var(--mono); font-size:11px; color:var(--text-faint); }
  .np-row input[type="text"]{ flex:1; }
  .np-pitch-display{
    font-family:var(--mono); font-size:20px; font-weight:700; color:var(--text);
  }
  .np-pitch-sub{ color:var(--text-faint); font-size:11px; margin-left:6px; }
  .np-multi{ color:var(--gold); font-size:11.5px; padding:8px 0; }

  .np-dual-track{
    position:relative; height:22px; margin-top:4px; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius-sm); cursor:pointer;
  }
  .np-dual-fill{
    position:absolute; top:1px; bottom:1px; background:var(--accent-soft);
    border-left:1px solid var(--accent); border-right:1px solid var(--accent);
    pointer-events:none;
  }
  .np-dual-handle{
    position:absolute; top:50%; width:7px; height:20px; transform:translate(-50%,-50%);
    background:var(--gold); border:1px solid #1a1200; border-radius:2px; cursor:ew-resize; z-index:2;
  }
  .np-dual-handle:hover, .np-dual-handle:active{ background:#e6b660; }

  /* ---------- Note Wave Editor ---------- */
  #noteWaveBody{ display:flex; height:100%; }
  #waveSidebar{
    width:75px; flex:0 0 75px; border-right:1px solid var(--border); display:flex; flex-direction:column;
    align-items:stretch; padding:8px 6px; gap:6px;
  }
  .wave-mode-btn{
    padding:7px 2px; font-size:10.5px; border-radius:5px; text-align:center;
  }
  .wave-mode-btn.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  #waveCanvasWrap{ flex:1; position:relative; }
  #noteWaveCanvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .wave-mini-toolbar{
    position:absolute; top:8px; right:10px; z-index:5;
    background:rgba(29,32,39,.88); border:1px solid var(--border); border-radius:var(--radius-pill);
    padding:5px; display:flex; gap:3px;
  }

  /* ---------- Splash ---------- */
  #splash{
    position:fixed; inset:0; z-index:200;
    background:rgba(6,7,9,0.6);
    display:flex; align-items:center; justify-content:center;
  }
  #splash.hidden{ display:none; }
  #splashPanel{
    width:440px; max-width:90vw;
    background:var(--surface-raised); border:1px solid var(--border); border-radius:var(--radius-md);
    box-shadow:0 30px 80px rgba(0,0,0,.55);
    overflow:hidden; display:flex; flex-direction:column;
  }
  .splash-image{ position:relative; width:100%; height:200px; background:var(--surface-alt); overflow:hidden; }
  .splash-image img{ width:100%; height:100%; object-fit:cover; display:block; }
  /* Fades the image (top) into the panel body's background toward the middle. */
  .splash-image-fade{
    position:absolute; inset:0;
    background:linear-gradient(to bottom, transparent 45%, var(--surface-raised) 100%);
  }
  .splash-version{ position:absolute; top:10px; right:12px; font-family:var(--mono); font-size:11px; color:rgba(255,255,255,.8); }
  .splash-body{ padding:4px 26px 22px; display:flex; flex-direction:column; align-items:flex-start; margin-top:-36px; position:relative; }
  .splash-mark{ width:40px; height:40px; border-radius:11px; margin-bottom:12px;
    background:radial-gradient(circle at 32% 28%, var(--gold), var(--accent) 68%);
    box-shadow:0 10px 26px rgba(200,66,92,.3); }
  .splash-title{ font-size:20px; font-weight:800; letter-spacing:.2px; margin-bottom:2px; }
  .splash-sub{ font-size:12px; color:var(--text-faint); margin-bottom:18px; }
  .splash-actions{ display:flex; flex-direction:column; gap:6px; width:100%; }
  .splash-actions button{ width:100%; padding:10px 14px; font-size:12.5px; text-align:left; display:flex; align-items:center; gap:10px; }
  .splash-actions button .num{ color:var(--text-faint); font-family:var(--mono); font-size:11px; }
  .splash-foot{ margin-top:14px; font-size:10.5px; color:var(--text-faint); }

  /* ---------- Modal / Toast ---------- */
  #modalRoot{ position:fixed; inset:0; z-index:300; display:none; align-items:center; justify-content:center; background:rgba(6,7,9,.55); }
  #modalRoot.show{ display:flex; }
  .modal-box{
    background:var(--surface-raised); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:20px 22px; width:340px; box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  .modal-box h3{ margin:0 0 8px; font-size:14px; }
  .modal-box p{ margin:0 0 16px; font-size:12px; color:var(--text-dim); line-height:1.5; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; }

  #toastRoot{ position:fixed; bottom:16px; right:16px; z-index:400; display:flex; flex-direction:column; gap:8px; }
  .toast{
    background:var(--surface-raised); border:1px solid var(--border); border-left:3px solid var(--gold);
    border-radius:var(--radius-sm); padding:9px 13px; font-size:11.5px; max-width:300px;
    box-shadow:0 10px 24px rgba(0,0,0,.4); animation:toastin .18s ease;
  }
  .toast.err{ border-left-color:var(--danger); }
  @keyframes toastin{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
</style>
</head>
<body>

<div id="splash">
  <div id="splashPanel">
    <div class="splash-image" id="splashImage">
      <div class="splash-image-fade"></div>
      <div class="splash-version">v0.1</div>
    </div>
    <div class="splash-body">
      <div class="splash-mark"></div>
      <div class="splash-title">SynCaviar</div>
      <div class="splash-sub">a small studio for singing synthesis</div>
      <div class="splash-actions">
        <button id="splashNew"><span class="num">1</span> New project</button>
        <button id="splashOpen"><span class="num">2</span> Open project&hellip;</button>
        <button id="splashAbout"><span class="num">3</span> About</button>
      </div>
      <div class="splash-foot">frontend preview &middot; AI rendering requires a local backend</div>
    </div>
  </div>
</div>

<div id="menubar">
  <div class="brand" id="brandLogo" title="Show splash screen"><div class="brand-mark"></div><div class="brand-name">SynCaviar</div></div>
  <div class="menu-item" id="fileMenu">
    <button class="menu-btn">File</button>
    <div class="menu-dropdown">
      <button id="menuNew">New <span class="hint"></span></button>
      <button id="menuOpen">Open&hellip; <span class="hint"></span></button>
      <button id="menuSave">Save as .scv <span class="hint"></span></button>
      <button id="menuExportWav">Export mix as .wav <span class="hint"></span></button>
    </div>
  </div>
  <div class="menu-item" id="editMenu">
    <button class="menu-btn">Help</button>
    <div class="menu-dropdown">
      <button id="menuAbout">About SynCaviar</button>
      <button id="menuBackend">AI backend status</button>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="transport">
    <div class="field"><span class="status-dot" id="backendDot"></span><span id="backendLabel">backend not connected</span></div>
    <button id="pingBackendBtn" title="Ping the Caviar backend now">Ping</button>
    <div class="field">BPM <input type="number" id="bpmInput" value="120" min="20" max="400" step="1"></div>
    <button id="rewindBtn" title="Rewind to start">⏮</button>
    <button id="playBtn" class="primary" title="Play">▶</button>
  </div>
</div>

<div id="app">

  <div class="panel" id="trackEditorPanel">
    <div class="panel-header">
      <span class="title">Track Editor</span>
      <span class="spacer"></span>
      <span class="subtitle" id="trackZoomLabel">zoom 1.00&times;</span>
    </div>
    <div class="panel-body">
      <div id="trackEditorBody">
        <div id="trackSidebar">
          <div id="trackRowsHost"></div>
          <div id="trackAddRow">
            <button class="add-track-btn" id="addSynthTrackBtn"><span class="plus">+</span> New track</button>
            <button class="add-track-btn" id="addAudioTrackBtn"><span class="plus">+</span> Import audio</button>
          </div>
        </div>
        <div id="trackContentWrap">
          <canvas id="trackRulerCanvas"></canvas>
          <div id="trackRowsScroll"><canvas id="trackRowsCanvas"></canvas></div>
        </div>
      </div>
    </div>
  </div>

  <div class="resizer horizontal" id="resizerTop"></div>

<!--
  Connects to the Caviar Hugging Face Space via the Gradio JS client. This
  has to be a module script (the client is only published as an ES module),
  so it's kept as this tiny standalone bootstrap: it just resolves the
  client and hands it to the rest of the app as `window.backendApp`. The
  main script (below) never touches this module scope directly -- it always
  goes through `window.backendApp`/`waitForBackendApp()` since a classic
  script can't see into a module's bindings, and because this connection
  resolves asynchronously while the classic script below runs immediately.
  Space id here (CAVIAR_SPACE_ID) is duplicated as a literal in the classic
  script's comments/status text below -- keep both in sync if it ever moves.
-->
<script type="module">
  import { client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";
  const CAVIAR_SPACE_ID = "hindsightform/syncaviarutaite";
  client(CAVIAR_SPACE_ID).then(app => {
    window.backendApp = app;
  }).catch(err => {
    console.error('Failed to connect to the Caviar backend space:', err);
  });
</script>

// ---- Small generic helpers ---------------------------------------------
function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, t){ return a + (b - a) * t; }

const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
// Mirrors SynCaviarApp::noteNumToName -- MIDI 12 is treated as C0.
function noteNumToName(noteNumber){
  const adjusted = noteNumber - 12;
  const name = NOTE_NAMES[((adjusted % 12) + 12) % 12];
  const octave = Math.floor(adjusted / 12);
  return name + octave;
}
// Mirrors SynCaviarApp::isBlackNote
function isBlackNote(midiNote){
  const n = ((midiNote % 12) + 12) % 12;
  return n === 1 || n === 3 || n === 6 || n === 8 || n === 10;
}

function secondsPerBeat(){ return 60 / state.bpm; }
function beatsToSeconds(beats){ return beats * secondsPerBeat(); }
function secondsToBeats(sec){ return sec / secondsPerBeat(); }

// devicePixelRatio-aware canvas sizing so strokes stay crisp on hi-dpi screens.
// IMPORTANT: this always measures the *parent* element, never the canvas's own
// box. A canvas that measured itself would go stale after the very first
// resize: setting canvas.style.width/height below is an inline style that
// permanently overrides the "width:100%" rule in the stylesheet, so a later
// call to canvas.getBoundingClientRect() would just keep reporting whatever
// size we last wrote -- it would never "see" the dock panel being resized
// again. Measuring the parent (a normal flowed element the canvas can't
// influence, since it's position:absolute) avoids that trap entirely.
function applyCanvasBox(canvas, cssW, cssH){
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(cssW));
  const h = Math.max(1, Math.round(cssH));
  if (canvas.__cssW !== w || canvas.__cssH !== h || canvas.__dpr !== dpr){
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    canvas.__cssW = w; canvas.__cssH = h; canvas.__dpr = dpr;
  }
  return { width: w, height: h };
}
// For canvases that fill their parent completely (position:absolute; inset:0).
function fitCanvasToParent(canvas){
  const p = canvas.parentElement;
  return applyCanvasBox(canvas, p.clientWidth, p.clientHeight);
}
// For canvases that span their parent's width but keep a fixed height
// (the track ruler: 22px regardless of how tall trackContentWrap is).
function fitCanvasFixedHeight(canvas, heightPx){
  const p = canvas.parentElement;
  return applyCanvasBox(canvas, p.clientWidth, heightPx);
}
// For a canvas that fills its parent minus a fixed-height header strip
// above it (the Piano Roll's main canvas, below its seconds ruler).
function fitCanvasBelowHeader(canvas, headerPx){
  const p = canvas.parentElement;
  return applyCanvasBox(canvas, p.clientWidth, p.clientHeight - headerPx);
}
// For a canvas offset from the left by a fixed-width sidebar (the Piano
// Roll's seconds ruler, which must not extend over the piano keys).
function fitCanvasMinusLeft(canvas, leftPx, heightPx){
  const p = canvas.parentElement;
  return applyCanvasBox(canvas, p.clientWidth - leftPx, heightPx);
}

function observeResize(el, cb){
  const ro = new ResizeObserver(() => cb());
  ro.observe(el);
  return ro;
}

// ---- Toast / modal ------------------------------------------------------

}

function showModal(title, bodyHtml, actions){

// ---- Musical-fraction labels for subdivided bar lines --------------------
// Reduces i/n to lowest terms so we can print "1.5b" / "1.25b" / "1.75b"
// style sub-bar labels the way a DAW ruler would, instead of raw decimals.
function gcd(a, b){ return b === 0 ? a : gcd(b, a % b); }
function subdivisionLabelSuffix(i, n){
  if (i === 0) return '';
  let num = i, den = n;
  const g = gcd(num, den);
  num /= g; den /= g;
  // Only label quarter-bar multiples (0.25b, 0.5b, 0.75b) even though finer
  // grid lines are drawn well past that now (up to 32nd-note resolution) --
  // labelling every fine subdivision would just clutter the ruler.
  if (![2,4].includes(den)) return null;
  const frac = num / den;
  return '.' + String(Math.round(frac * 1000) / 1000).split('.')[1];
}

const trackRowsHost   = document.getElementById('trackRowsHost');
const trackSidebar    = document.getElementById('trackSidebar');
const trackRowsScroll = document.getElementById('trackRowsScroll');
const trackRulerCanvas= document.getElementById('trackRulerCanvas');

function formatDuration(sec){
  sec = Math.max(0, sec || 0);
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}
function initialsFor(name){
  const parts = name.trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return '?';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}
function trackPxPerSecond(){ return trackPxPerSecondAtZoom1 * state.view.track.zoom; }

// ---- Volume knob (drag up/down; double-click resets to unity gain) ----
function createKnob(track){
  const wrap = document.createElement('div');
  wrap.className = 'knob'; wrap.title = 'Volume (drag, double-click to reset)';
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 32 32');
  const bg = document.createElementNS(svg.namespaceURI, 'circle');
  bg.setAttribute('cx', 16); bg.setAttribute('cy', 16); bg.setAttribute('r', 14);
  bg.setAttribute('fill', '#1d2027'); bg.setAttribute('stroke', '#2b2e36'); bg.setAttribute('stroke-width', 1.5);
  const tick = document.createElementNS(svg.namespaceURI, 'line');
  tick.setAttribute('x1', 16); tick.setAttribute('y1', 16);
  tick.setAttribute('stroke', '#d3a24a'); tick.setAttribute('stroke-width', 2.4); tick.setAttribute('stroke-linecap', 'round');
  svg.appendChild(bg); svg.appendChild(tick); wrap.appendChild(svg);

  function redraw(){
    const t = clamp(track.volume / 1.5, 0, 1);
    const angleDeg = -135 + t * 270;
    const rad = (angleDeg - 90) * Math.PI / 180;
    tick.setAttribute('x2', 16 + Math.cos(rad) * 10.5);
    tick.setAttribute('y2', 16 + Math.sin(rad) * 10.5);
  }
  redraw();
  let dragging = false, startY = 0, startVol = 0;
  wrap.addEventListener('pointerdown', (e) => {
    dragging = true; startY = e.clientY; startVol = track.volume;
    wrap.setPointerCapture(e.pointerId); e.stopPropagation(); e.preventDefault();
  });
  wrap.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    track.volume = clamp(startVol + (startY - e.clientY) * 0.007, 0, 1.5);
    redraw();
  });
  wrap.addEventListener('pointerup', () => { if (dragging){ dragging = false; markMixDirty(); } });
  wrap.addEventListener('dblclick', (e) => { e.stopPropagation(); track.volume = 1.0; redraw(); markMixDirty(); });
  return wrap;
}

function cycleSinger(track){
  const idx = SINGER_IDS.indexOf(track.singerId);
  track.singerId = SINGER_IDS[(idx + 1) % SINGER_IDS.length];
  markTrackDirty(track);
  renderTrackEditorRows();
}

function selectTrack(trackId){
  state.currentTrackId = trackId;
  state.selectedNoteIds = new Set();
  state.activeNoteId = null;
  renderTrackEditorRows();
  renderPianoRoll();
  renderNoteWave();
  renderNoteProperties();

function removeTrack(trackId){
  if (state.tracks.length === 1){ toast('At least one track is required.', true); return; }
  const idx = state.tracks.findIndex(t => t.id === trackId);
  if (idx < 0) return;
  state.tracks.splice(idx, 1);
  if (state.currentTrackId === trackId) state.currentTrackId = state.tracks[0].id;
  markMixDirty();
  renderTrackEditorRows(); renderPianoRoll(); renderNoteWave(); renderNoteProperties();
}

function addSynthTrack(){
  const singerId = SINGER_IDS[state.tracks.length % SINGER_IDS.length];
  const t = makeSynthTrack('Track ' + (state.tracks.length + 1), singerId);
  state.tracks.push(t);
  markTrackDirty(t);
  selectTrack(t.id);

function renderTrackEditorRows(){
  trackRowsHost.innerHTML = '';
  state.tracks.forEach(track => {
    const row = document.createElement('div');
    row.className = 'track-row' + (track.id === state.currentTrackId ? ' selected' : '');

    const icon = document.createElement('div');
    icon.className = 'track-icon' + (track.type === 'audio' ? ' audio-icon' : '');

      icon.textContent = '♪';
    } else {
      const singer = SINGER_REGISTRY[track.singerId] || SINGER_REGISTRY.silent;
      icon.style.background = singer.color;
      const fallback = document.createElement('span');
      fallback.textContent = initialsFor(singer.name);
      const img = document.createElement('img');
      img.src = singer.pfpSrc;
      img.alt = '';
      img.className = 'track-icon-pfp';
      img.onerror = () => { img.remove(); }; // falls back to the color + initials underneath
      icon.appendChild(fallback);
      icon.appendChild(img);
    }
    row.appendChild(icon);

    const main = document.createElement('div'); main.className = 'track-main';
    const nameInput = document.createElement('input');
    nameInput.type = 'text'; nameInput.className = 'track-name'; nameInput.value = track.name;
    nameInput.addEventListener('click', e => e.stopPropagation());
    nameInput.addEventListener('change', () => {
      track.name = nameInput.value.trim() || track.name;
      renderTrackEditorRows();
      if (track.id === state.currentTrackId) renderPianoRoll();
    });
    main.appendChild(nameInput);

    const typeLabel = document.createElement('div'); typeLabel.className = 'track-type';
    typeLabel.textContent = track.type === 'synth'
      ? ((SINGER_REGISTRY[track.singerId] || {}).name || 'Silent')
      : (track.fileName || 'Audio clip') + ' \u00b7 ' + formatDuration(track.durationSec);
    main.appendChild(typeLabel);

    const controls = document.createElement('div'); controls.className = 'track-controls';
    if (track.type === 'synth'){
      const singerBtn = document.createElement('button');
      singerBtn.className = 'mini-btn'; singerBtn.textContent = (SINGER_REGISTRY[track.singerId] || {}).name || 'Silent';
      singerBtn.title = 'Change singer (which voice/engine renders this track\u2019s audio)';
      singerBtn.addEventListener('click', e => { e.stopPropagation(); cycleSinger(track); });
      controls.appendChild(singerBtn);
    }
    const muteBtn = document.createElement('button');
    muteBtn.className = 'mini-btn mute' + (track.muted ? ' active' : ''); muteBtn.textContent = 'M'; muteBtn.title = 'Mute';
    muteBtn.addEventListener('click', e => { e.stopPropagation(); track.muted = !track.muted; markMixDirty(); renderTrackEditorRows(); });
    const soloBtn = document.createElement('button');
    soloBtn.className = 'mini-btn solo' + (track.solo ? ' active' : ''); soloBtn.textContent = 'S'; soloBtn.title = 'Solo';
    soloBtn.addEventListener('click', e => { e.stopPropagation(); track.solo = !track.solo; markMixDirty(); renderTrackEditorRows(); });
    controls.appendChild(muteBtn); controls.appendChild(soloBtn);
    controls.appendChild(createKnob(track));
    main.appendChild(controls);
    row.appendChild(main);

    const removeBtn = document.createElement('button');
    removeBtn.className = 'track-remove'; removeBtn.textContent = '\u00d7'; removeBtn.title = 'Remove track';
    removeBtn.addEventListener('click', e => { e.stopPropagation(); removeTrack(track.id); });
    row.appendChild(removeBtn);

    row.addEventListener('click', () => selectTrack(track.id));
    trackRowsHost.appendChild(row);
  });
  renderTrackContent();
}

// trackRowsCanvas must be taller than its scroll viewport, so it is sized
// manually (from trackRowsScroll's own box) rather than via fitCanvasToParent.
function fitTrackRowsCanvas(){
  const w = trackRowsScroll.clientWidth;
  const totalH = Math.max(trackRowsScroll.clientHeight, state.tracks.length * trackRowHeightPx);
  return applyCanvasBox(trackRowsCanvas, w, totalH);
}

function renderTrackRuler(){
  const { width, height } = fitCanvasFixedHeight(trackRulerCanvas, 22);
  const ctx = trackRulerCanvas.getContext('2d');
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = '#1d2027'; ctx.fillRect(0, 0, width, height);
  const pxPerSec = trackPxPerSecond();
  const leftSec = state.view.track.x / pxPerSec;
  const rightSec = (state.view.track.x + width) / pxPerSec;
  const niceSteps = [1,2,5,10,15,30,60,120,300,600,900];
  let step = niceSteps[niceSteps.length - 1];
  for (const s of niceSteps){ if (s * pxPerSec > 55){ step = s; break; } }
  const first = Math.floor(leftSec / step) * step;
  ctx.strokeStyle = PALETTE.gridLineSoft;
  ctx.fillStyle = 'rgba(233,230,223,0.55)';
  ctx.font = '10px ' + FONT_MONO; ctx.textBaseline = 'middle';
  for (let s = first; s <= rightSec + step; s += step){
    const x = s * pxPerSec - state.view.track.x;
    ctx.beginPath(); ctx.moveTo(Math.round(x)+0.5, height*0.4); ctx.lineTo(Math.round(x)+0.5, height); ctx.stroke();
    ctx.fillText(formatDuration(s), x + 4, height * 0.42);
  }
}

function renderTrackContent(){
  const { width: w, height: h } = fitTrackRowsCanvas();
  const ctx = trackRowsCanvas.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  const pxPerSec = trackPxPerSecond();
  state.tracks.forEach((track, i) => {
    const rowY = i * trackRowHeightPx;
    ctx.fillStyle = (i % 2 === 0) ? '#171920' : '#15161b';
    ctx.fillRect(0, rowY, w, trackRowHeightPx);
    ctx.strokeStyle = PALETTE.gridLineSoft;
    ctx.beginPath(); ctx.moveTo(0, rowY + trackRowHeightPx - 0.5); ctx.lineTo(w, rowY + trackRowHeightPx - 0.5); ctx.stroke();

    if (track.type === 'audio'){
      const x1 = -state.view.track.x, x2 = track.durationSec * pxPerSec - state.view.track.x;
      const drawX1 = Math.max(0, x1), drawX2 = Math.min(w, x2), drawW = Math.max(2, drawX2 - drawX1);
      ctx.beginPath(); roundRectPath(ctx, drawX1, rowY + 14, drawW, trackRowHeightPx - 28, 4);
      ctx.fillStyle = 'rgba(211,162,74,0.24)'; ctx.fill();
      ctx.strokeStyle = 'rgba(211,162,74,0.65)'; ctx.lineWidth = 1; ctx.stroke();
      if (track._pcm && track._pcm.data.length && drawX2 > drawX1){
        // Only scan the samples under each *visible* pixel column -- never
        // the whole file -- so this stays cheap regardless of clip length.
        const pcm = track._pcm.data, sr = track._pcm.sampleRate;
        const midY = rowY + trackRowHeightPx / 2;
        const ampPx = (trackRowHeightPx - 30) / 2;
        ctx.strokeStyle = 'rgba(233,230,223,0.55)'; ctx.lineWidth = 1;
        ctx.save(); ctx.beginPath(); roundRectPath(ctx, drawX1, rowY + 14, drawW, trackRowHeightPx - 28, 4); ctx.clip();
        ctx.beginPath();
        for (let px = Math.floor(drawX1); px < Math.ceil(drawX2); px++){
          const t0 = (px + state.view.track.x) / pxPerSec;
          const t1 = (px + 1 + state.view.track.x) / pxPerSec;
          const s0 = Math.max(0, Math.floor(t0 * sr));
          const s1 = Math.min(pcm.length, Math.max(s0 + 1, Math.floor(t1 * sr)));
          let mn = 1, mx = -1;
          for (let s = s0; s < s1; s++){ const v = pcm[s]; if (v < mn) mn = v; if (v > mx) mx = v; }
          if (mx < mn){ mn = 0; mx = 0; }
          ctx.moveTo(px + 0.5, midY - mx * ampPx);
          ctx.lineTo(px + 0.5, midY - mn * ampPx);
        }
        ctx.stroke();
        ctx.restore();
      } else if (!track._pcmLoadRequested){
        track._pcmLoadRequested = true;
        ensureTrackPcm(track).then(() => renderTrackContent());
      }
      ctx.fillStyle = 'rgba(233,230,223,0.7)'; ctx.font = '11px ' + FONT_SANS; ctx.textBaseline = 'top';
      ctx.fillText(track.fileName || 'audio', drawX1 + 8, rowY + 18);
    } else {
      track.notes.forEach(note => {
        const x1 = beatsToSeconds(note.start) * pxPerSec - state.view.track.x;
        const x2 = beatsToSeconds(note.end) * pxPerSec - state.view.track.x;
        if (x2 < 0 || x1 > w) return;
        const relPitch = clamp((note.pitch - NOTE_MIN) / (NOTE_MAX - NOTE_MIN), 0, 1);
        const noteY = rowY + trackRowHeightPx - 12 - relPitch * (trackRowHeightPx - 24);
        ctx.fillStyle = note.overlapping ? 'rgba(211,162,74,0.4)' : '#d3a24a';
        ctx.fillRect(x1, noteY, Math.max(1.5, x2 - x1), 3);
      });
    }
  });
  drawPlayheadLine(ctx, playheadSec * pxPerSec - state.view.track.x, w, h);
  renderTrackRuler();
}

let syncingTrackScroll = false;
function syncTrackScroll(source, target){
  if (syncingTrackScroll) return;
  syncingTrackScroll = true; target.scrollTop = source.scrollTop; syncingTrackScroll = false;
}
trackSidebar.addEventListener('scroll', () => syncTrackScroll(trackSidebar, trackRowsScroll));
trackRowsScroll.addEventListener('scroll', () => syncTrackScroll(trackRowsScroll, trackSidebar));

// ---- Track content panning / zoom (mirrors main.cpp's TrackEditorGuiFunction IO) ----
let trackPanInteraction = null;
function trackRulerSecAt(clientX){
  const rect = trackRulerCanvas.getBoundingClientRect();
  return (clientX - rect.left + state.view.track.x) / trackPxPerSecond();
}
trackRulerCanvas.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  trackRulerCanvas.setPointerCapture(e.pointerId);
  startSeekDrag(trackRulerSecAt(e.clientX));
});
trackRulerCanvas.addEventListener('pointermove', (e) => continueSeekDrag(trackRulerSecAt(e.clientX)));
trackRulerCanvas.addEventListener('contextmenu', e => e.preventDefault());
// endSeekDrag is wired to window pointerup once, further down with the rest of the playback code.

trackRowsCanvas.addEventListener('pointerdown', (e) => {
  if (e.button === 1){
    e.preventDefault();
    trackRowsCanvas.setPointerCapture(e.pointerId);
    trackPanInteraction = { lastX: e.clientX };
    state.activeScrollingWindow = 'TrackEditor';
    return;
  }
  if (e.button !== 0) return;
  const rect = trackRowsCanvas.getBoundingClientRect();
  const y = e.clientY - rect.top;
  const idx = Math.floor(y / trackRowHeightPx);
  const track = state.tracks[idx];
  if (track) selectTrack(track.id);
});
trackRowsCanvas.addEventListener('pointermove', (e) => {
  if (!trackPanInteraction) return;
  state.view.track.x -= (e.clientX - trackPanInteraction.lastX);
  if (state.view.track.x < 0) state.view.track.x = 0;
  trackPanInteraction.lastX = e.clientX;
  renderTrackContent();
});
window.addEventListener('pointerup', () => { if (trackPanInteraction){ trackPanInteraction = null; state.activeScrollingWindow = ''; } });
trackRowsCanvas.addEventListener('contextmenu', e => e.preventDefault());

trackContentWrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const wheel = -e.deltaY / 100;
  if (e.ctrlKey){
    // Anchor-preserving zoom, same formula as the Piano Roll's X zoom: keep
    // the point in time under the cursor fixed on screen while zoom changes
    // (previously this just changed zoom with no recentering at all, which
    // is the same class of bug the Piano Roll's Y zoom had).
    const rect = trackContentWrap.getBoundingClientRect();
    const mouseInWindow = e.clientX - rect.left;
    const past = state.view.track.zoom;
    const zNew = clamp(past + 0.1 * wheel, 0.1, 4);
    state.view.track.zoom = zNew;
    if (wheel !== 0) state.view.track.x = (state.view.track.x + mouseInWindow) * (zNew / past) - mouseInWindow;
    if (state.view.track.x < 0) state.view.track.x = 0;
    trackZoomLabel.textContent = 'zoom ' + state.view.track.zoom.toFixed(2) + '\u00d7';
  } else if (e.shiftKey){
    // Pixel-space pan speed, not scaled by zoom (matches the other panels --
    // scaling by zoom made panning feel awfully slow whenever zoomed out,
    // since a fixed *number of seconds* moved per scroll regardless of zoom
    // is a shrinking fraction of the much-wider-in-seconds visible window).
    state.view.track.x -= wheel * 33.5;
    if (state.view.track.x < 0) state.view.track.x = 0;
  } else {
    trackRowsScroll.scrollTop -= wheel * 40;
  }
  renderTrackContent();
}, { passive:false });

document.getElementById('addSynthTrackBtn').addEventListener('click', addSynthTrack);
document.getElementById('addAudioTrackBtn').addEventListener('click', () => audioUploadInput.click());
audioUploadInput.addEventListener('change', () => {

});

const FONT_MONO = "'JetBrains Mono', Menlo, Consolas, monospace";
const FONT_SANS = "'Manrope', -apple-system, sans-serif";

const pianoCanvas = document.getElementById('pianoRollCanvas');
const pianoCtx = pianoCanvas.getContext('2d');
const pianoRulerCanvas = document.getElementById('pianoRulerCanvas');
const pianoToolbarEl = document.getElementById('pianoToolbar');
const pianoRollBody = document.getElementById('pianoRollBody');
const pianoRollTrackNameEl = document.getElementById('pianoRollTrackName');

// ---- Shared time-axis helpers ----
// state.view.pianoTime is intentionally shared between the Piano Roll and the
// Note Wave Editor so panning/zooming one moves the other in lockstep.
function actualBarWidthPx(){ return pianoTimeMarkersPerZoomX * state.view.pianoTime.zoomX; }
function actualKeyHeightPx(){ return pianoKeyHeightPerZoomY * state.view.pianoPitch.zoomY; }
function beatsToWorldX(beats){ return (beats / BEATS_PER_BAR) * actualBarWidthPx(); }
function worldXToBeats(worldX){ return (worldX / actualBarWidthPx()) * BEATS_PER_BAR; }
function timeWorldToScreenX(worldX){ return worldX - state.view.pianoTime.x; }
function timeScreenToWorldX(screenX){ return screenX + state.view.pianoTime.x; }
function currentSubdivisionsPerBar(){
  // Solve for how many times barWidth must double to land near a target
  // pixel spacing, instead of stepping by a fixed additive threshold: that
  // keeps the on-screen marker COUNT roughly constant across zoom levels
  // (old formula let it dip in the middle of the zoom range and would have
  // exploded if pushed to a much higher max zoom).
  const barWidth = actualBarWidthPx();
  const raw = barWidth / pianoTimeMarkersTargetPx;
  if (raw <= 1) return 1;
  return Math.min(64, Math.pow(2, Math.round(Math.log2(raw))));
}
function snapBeats(beats){
  if (!state.magnet) return beats;
  const gridBeat = BEATS_PER_BAR / currentSubdivisionsPerBar();
  return Math.round(beats / gridBeat) * gridBeat;
}
// Used specifically for placing a *new* note: floors to the start of the
// grid cell the mouse is over, rather than rounding to the nearest line
// (rounding meant clicking anywhere past a cell's midpoint placed the note
// in the *next* cell over -- correct only right next to a gridline).
function snapBeatsFloor(beats){
  if (!state.magnet) return beats;
  const gridBeat = BEATS_PER_BAR / currentSubdivisionsPerBar();
  return Math.floor(beats / gridBeat) * gridBeat;
}
function pianoNoteAnchorY(heightCss){
  return state.view.pianoPitch.y + heightCss - actualKeyHeightPx();
}
function noteToScreenY(note, heightCss){
  return pianoNoteAnchorY(heightCss) - (note - VIEW_LOWEST_NOTE) * actualKeyHeightPx();
}
function screenYToNote(screenY, heightCss){
  // The row for note N spans screenY in [noteToScreenY(N), noteToScreenY(N)+keyH),
  // i.e. (anchor-screenY)/keyH lands in (N-LOW-1, N-LOW] for that row -- ceil is
  // the correct inverse of that half-open interval, not floor (floor would put
  // almost the entire visible row one semitone too low).
  return VIEW_LOWEST_NOTE + Math.ceil((pianoNoteAnchorY(heightCss) - screenY) / actualKeyHeightPx());
}
function clampPianoTimeX(){
  if (state.view.pianoTime.x + pianoKeyWidth < 0) state.view.pianoTime.x = -pianoKeyWidth;
}
function clampPianoPitchY(heightCss){
  if (state.view.pianoPitch.y < 0) state.view.pianoPitch.y = 0;
  const maxY = (VIEW_HIGHEST_NOTE - VIEW_LOWEST_NOTE) * actualKeyHeightPx() - heightCss;
  if (state.view.pianoPitch.y > Math.max(0, maxY)) state.view.pianoPitch.y = Math.max(0, maxY);
}
function clampPianoView(heightCss){
  clampPianoTimeX();
  clampPianoPitchY(heightCss);
}

function roundRectPath(ctx, x, y, w, h, r){
  r = Math.max(0, Math.min(r, w/2, h/2));
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

// Reduces edited-note bookkeeping down to a single pass: sort by start time,
// flag any pair whose spans intersect. Used for the dim/overlap visual and
// as the trigger condition for AI re-render requests.
function recomputeOverlaps(track){
  if (!track || track.type !== 'synth') return;
  track.notes.forEach(n => n.overlapping = false);
  const sorted = track.notes.slice().sort((a,b) => a.start - b.start);
  for (let i = 0; i < sorted.length; i++){
    for (let j = i+1; j < sorted.length; j++){
      if (sorted[j].start >= sorted[i].end) break;
      sorted[i].overlapping = true;
      sorted[j].overlapping = true;
    }
  }
}

function removeNote(track, noteId){
  const idx = track.notes.findIndex(n => n.id === noteId);
  if (idx >= 0) track.notes.splice(idx, 1);
  state.selectedNoteIds.delete(noteId);
  if (state.activeNoteId === noteId) state.activeNoteId = null;
}

// ---- Drawing ----
function drawGrid(ctx, widthCss, heightCss){
  const barWidth = actualBarWidthPx();
  const leftBarIdx = (state.view.pianoTime.x + pianoKeyWidth) / barWidth;
  const rightBarIdx = widthCss / barWidth + leftBarIdx;
  const nSub = currentSubdivisionsPerBar();
  for (let bar = Math.floor(leftBarIdx); bar < rightBarIdx; bar++){
    const x = bar * barWidth - state.view.pianoTime.x;
    if (nSub > 1){
      for (let i = 1; i < nSub; i++){
        const subX = x + (barWidth / nSub) * i;
        const isHalf = (nSub / i === 2);
        ctx.strokeStyle = PALETTE.gridLineSoft;
        ctx.lineWidth = isHalf ? 1.3 : 0.7;
        ctx.beginPath(); ctx.moveTo(Math.round(subX)+0.5, 0); ctx.lineTo(Math.round(subX)+0.5, heightCss); ctx.stroke();
        if (barWidth / nSub > 42){
          const suffix = subdivisionLabelSuffix(i, nSub);
          if (suffix){
            ctx.fillStyle = 'rgba(233,230,223,0.3)';
            ctx.font = '9px ' + FONT_MONO;
            ctx.textBaseline = 'top';
            ctx.fillText(bar + suffix + 'b', subX + 3, 3);
          }
        }
      }
    }
    ctx.strokeStyle = PALETTE.gridBar;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(Math.round(x)+0.5, 0); ctx.lineTo(Math.round(x)+0.5, heightCss); ctx.stroke();
    if (bar >= 0){
      ctx.fillStyle = 'rgba(233,230,223,0.55)';
      ctx.font = '10.5px ' + FONT_MONO;
      ctx.textBaseline = 'top';
      ctx.fillText(bar + 'b', x + 4, 3);
    }
  }
}

function drawPianoKeys(ctx, widthCss, heightCss){
  const keyH = actualKeyHeightPx();
  const bottomNote = Math.floor(state.view.pianoPitch.y / keyH) + VIEW_LOWEST_NOTE;
  const topNote = Math.floor(heightCss / keyH) + bottomNote + 2;
  for (let n = bottomNote; n < topNote; n++){
    if (n < VIEW_LOWEST_NOTE || n > VIEW_HIGHEST_NOTE) continue;
    const y = noteToScreenY(n, heightCss);
    const black = isBlackNote(n);
    ctx.fillStyle = black ? PALETTE.keyBlack : PALETTE.keyWhite;
    ctx.fillRect(0, y, pianoKeyWidth, keyH);
    if (n < NOTE_MIN || n > NOTE_MAX){
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(pianoKeyWidth, y, widthCss - pianoKeyWidth, keyH);
    }
    ctx.strokeStyle = PALETTE.gridLineSoft;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, Math.round(y+keyH)+0.5); ctx.lineTo(widthCss, Math.round(y+keyH)+0.5); ctx.stroke();
    if (keyH > 8){
      ctx.fillStyle = black ? PALETTE.keyBlackText : PALETTE.keyWhiteText;
      ctx.font = (keyH > 15 ? '10px ' : '8px ') + FONT_MONO;
      ctx.textBaseline = 'middle';
      ctx.fillText(noteNumToName(n), 7, y + keyH/2);
    }
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pianoKeyWidth+0.5, 0); ctx.lineTo(pianoKeyWidth+0.5, heightCss); ctx.stroke();
}

function drawVibratoSquiggle(ctx, note, x1, x2, y, keyH){
  const lo = clamp(Math.min(note.vibrato.rangeStart, note.vibrato.rangeEnd), 0, 1);
  const hi = clamp(Math.max(note.vibrato.rangeStart, note.vibrato.rangeEnd), 0, 1);
  if (hi - lo < 0.01) return;
  const durSec = beatsToSeconds(note.end - note.start) * (hi - lo);
  const vibX1 = x1 + (x2 - x1) * lo, vibX2 = x1 + (x2 - x1) * hi;
  if (vibX2 - vibX1 < 2) return;
  const amp = Math.min(keyH*0.32, Math.abs(note.vibrato.depth) * keyH * 0.32);
  if (amp < 0.6) return;
  const cycles = Math.max(1, note.vibrato.frequency * durSec * 0.5);
  const sign = note.vibrato.depth < 0 ? -1 : 1;
  ctx.strokeStyle = 'rgba(0,0,0,0.45)';
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  const steps = 28;
  for (let i = 0; i <= steps; i++){
    const t = i/steps;
    const px = vibX1 + (vibX2 - vibX1) * t;
    const py = y + keyH/2 + Math.sin(t * cycles * Math.PI * 2) * amp * sign;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
}

function drawNotes(ctx, widthCss, heightCss, track){
  const keyH = actualKeyHeightPx();
  track.notes.forEach(note => {
    const x1 = timeWorldToScreenX(beatsToWorldX(note.start));
    const x2 = timeWorldToScreenX(beatsToWorldX(note.end));
    const y = noteToScreenY(note.pitch, heightCss);
    if (x2 < pianoKeyWidth || x1 > widthCss || y + keyH < 0 || y > heightCss) return;
    const w = Math.max(2, x2 - x1);
    const selected = state.selectedNoteIds.has(note.id);
    ctx.beginPath();
    roundRectPath(ctx, x1, y+1.5, w, Math.max(2, keyH-3), 3);
    ctx.fillStyle = note.overlapping ? PALETTE.noteDim : (selected ? PALETTE.noteFillAlt : PALETTE.noteFill);
    ctx.fill();
    ctx.lineWidth = selected ? 2 : 1;
    ctx.strokeStyle = selected ? PALETTE.noteSelected : 'rgba(0,0,0,0.35)';
    ctx.stroke();
    if (note.lyric && w > 18){
      ctx.save();
      ctx.beginPath(); ctx.rect(x1, y, w, keyH); ctx.clip();
      ctx.fillStyle = 'rgba(0,0,0,0.72)';
      ctx.font = '10px ' + FONT_SANS;
      ctx.textBaseline = 'middle';
      ctx.fillText(note.lyric, x1+4, y+keyH/2+1);
      ctx.restore();
    }
    if (note.vibrato && note.vibrato.depth !== 0 && w > 14){
      drawVibratoSquiggle(ctx, note, x1, x2, y, keyH);
    }
  });
}

function drawSelectionBox(ctx){
  if (!pianoInteraction || pianoInteraction.type !== 'select') return;
  const x1 = Math.min(pianoInteraction.startX, pianoInteraction.curX);
  const x2 = Math.max(pianoInteraction.startX, pianoInteraction.curX);
  const y1 = Math.min(pianoInteraction.startY, pianoInteraction.curY);
  const y2 = Math.max(pianoInteraction.startY, pianoInteraction.curY);
  ctx.fillStyle = PALETTE.selectionBox;
  ctx.fillRect(x1, y1, x2-x1, y2-y1);
  ctx.strokeStyle = PALETTE.selectionBoxBorder;
  ctx.lineWidth = 1;
  ctx.strokeRect(x1+0.5, y1+0.5, Math.max(0,x2-x1-1), Math.max(0,y2-y1-1));
}

const PIANO_RULER_HEIGHT = 20;
function renderPianoRoll(){
  const { width, height } = fitCanvasBelowHeader(pianoCanvas, PIANO_RULER_HEIGHT);
  const ctx = pianoCtx;
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = '#141519'; ctx.fillRect(0, 0, width, height);
  drawGrid(ctx, width, height);
  const track = getCurrentTrack();
  const isSynth = !!(track && track.type === 'synth');
  if (isSynth) drawNotes(ctx, width, height, track);
  drawSelectionBox(ctx);
  drawPlayheadLine(ctx, timeWorldToScreenX(beatsToWorldX(secondsToBeats(playheadSec))), width, height);
  drawPianoKeys(ctx, width, height);
  if (!isSynth){
    ctx.fillStyle = 'rgba(233,230,223,0.38)';
    ctx.font = '12px ' + FONT_SANS;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(track ? 'Audio tracks have no note data' : 'No track selected', pianoKeyWidth + (width-pianoKeyWidth)/2, height/2);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }
  pianoRollTrackNameEl.textContent = track ? ('— ' + track.name) : '';
  renderPianoRuler();
}

// Seconds-based ruler above the grid, offset past the piano keys. Clicking
// or dragging it only ever moves the playhead -- it's a separate canvas
// from the note grid, so no tool (pencil/eraser/etc.) can edit notes here.
function renderPianoRuler(){
  const { width, height } = fitCanvasMinusLeft(pianoRulerCanvas, pianoKeyWidth, PIANO_RULER_HEIGHT);
  const ctx = pianoRulerCanvas.getContext('2d');
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = '#1d2027'; ctx.fillRect(0, 0, width, height);
  const pxPerSec = beatsToWorldX(secondsToBeats(1));
  const leftSec = beatsToSeconds(worldXToBeats(waveScreenToWorldX(0)));
  const rightSec = beatsToSeconds(worldXToBeats(waveScreenToWorldX(width)));
  const niceSteps = [0.1,0.2,0.5,1,2,5,10,15,30,60,120,300,600];
  let step = niceSteps[niceSteps.length - 1];
  for (const s of niceSteps){ if (s * pxPerSec > 50){ step = s; break; } }
  const first = Math.floor(leftSec / step) * step;
  ctx.strokeStyle = PALETTE.gridLineSoft;
  ctx.fillStyle = 'rgba(233,230,223,0.55)';
  ctx.font = '10px ' + FONT_MONO; ctx.textBaseline = 'middle';
  for (let s = first; s <= rightSec + step; s += step){
    if (s < -0.001) continue;
    const x = waveWorldToScreenX(beatsToWorldX(secondsToBeats(s)));
    ctx.beginPath(); ctx.moveTo(Math.round(x)+0.5, height*0.4); ctx.lineTo(Math.round(x)+0.5, height); ctx.stroke();
    ctx.fillText((step < 1 ? s.toFixed(1) : Math.round(s)) + 's', x + 3, height * 0.42);
  }
}
function pianoRulerSecAt(clientX){
  const rect = pianoRulerCanvas.getBoundingClientRect();
  return beatsToSeconds(worldXToBeats(waveScreenToWorldX(clientX - rect.left)));
}
pianoRulerCanvas.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  pianoRulerCanvas.setPointerCapture(e.pointerId);
  startSeekDrag(pianoRulerSecAt(e.clientX));
});
pianoRulerCanvas.addEventListener('pointermove', (e) => continueSeekDrag(pianoRulerSecAt(e.clientX)));
pianoRulerCanvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('pointerup', endSeekDrag);

// ---- Interaction ----
const RESIZE_MARGIN = 6;
let pianoInteraction = null;
let pianoRollHovered = false;
pianoRollBody.addEventListener('mouseenter', () => pianoRollHovered = true);
pianoRollBody.addEventListener('mouseleave', () => pianoRollHovered = false);

function hitTestNote(track, screenX, screenY, heightCss){
  if (!track || track.type !== 'synth') return null;
  const keyH = actualKeyHeightPx();
  for (let i = track.notes.length - 1; i >= 0; i--){
    const note = track.notes[i];
    const y = noteToScreenY(note.pitch, heightCss);
    if (screenY < y || screenY > y + keyH) continue;
    const x1 = timeWorldToScreenX(beatsToWorldX(note.start));
    const x2 = timeWorldToScreenX(beatsToWorldX(note.end));
    if (screenX < x1 || screenX > x2) continue;
    let edge = null;
    if (screenX - x1 <= RESIZE_MARGIN) edge = 'left';
    else if (x2 - screenX <= RESIZE_MARGIN) edge = 'right';
    return { note, edge };
  }
  return null;
}

function updateSelectionFromBox(track, inter){
  const x1 = Math.min(inter.startX, inter.curX), x2 = Math.max(inter.startX, inter.curX);
  const y1 = Math.min(inter.startY, inter.curY), y2 = Math.max(inter.startY, inter.curY);
  const sel = new Set(inter.initialSelection);
  if (track && track.type === 'synth'){
    const keyH = actualKeyHeightPx();
    track.notes.forEach(n => {
      const nx1 = timeWorldToScreenX(beatsToWorldX(n.start));
      const nx2 = timeWorldToScreenX(beatsToWorldX(n.end));
      const ny = noteToScreenY(n.pitch, inter.heightCss);
      if (nx1 < x2 && nx2 > x1 && ny < y2 && ny + keyH > y1) sel.add(n.id);
    });
  }
  state.selectedNoteIds = sel;
}

function pianoPointerDown(e){
  if (e.button === 1) e.preventDefault();
  pianoCanvas.setPointerCapture(e.pointerId);
  const rect = pianoCanvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const heightCss = rect.height;
  const track = getCurrentTrack();

  if (e.button === 1){
    pianoInteraction = { type:'pan', lastX:e.clientX, lastY:e.clientY };
    state.activeScrollingWindow = 'PianoRollEditor';
    return;
  }
  if (e.button !== 0) return;
  if (x < pianoKeyWidth) return; // key column: no preview audio wired up yet
  if (!track || track.type !== 'synth') return;

  if (state.tool === 'pencil'){
    const hit = hitTestNote(track, x, y, heightCss);
    if (hit) return; // pencil only paints on empty space
    const pitch = clamp(screenYToNote(y, heightCss), VIEW_LOWEST_NOTE, VIEW_HIGHEST_NOTE);
    if (pitch < NOTE_MIN || pitch > NOTE_MAX){ toast('Notes can only be placed between C2 and C8.', true); return; }
    const beat = Math.max(0, snapBeatsFloor(worldXToBeats(timeScreenToWorldX(x))));
    // Belt-and-suspenders: block exact-duplicate stacking even if the pixel
    // hitbox above was too thin to catch it (e.g. a very short note at low zoom).
    if (track.notes.some(n => n.pitch === pitch && Math.abs(n.start - beat) < 1e-6)) return;
    const gridBeat = BEATS_PER_BAR / currentSubdivisionsPerBar();
    const defaultLen = state.magnet ? gridBeat : 0.25;
    const note = makeNote(beat, beat + defaultLen, pitch);
    track.notes.push(note);
    state.selectedNoteIds = new Set([note.id]);
    state.activeNoteId = note.id;
    pianoInteraction = { type:'pencil-draw', note, anchorBeat: beat };
    recomputeOverlaps(track);
    renderPianoRoll(); renderNoteProperties(); renderTrackEditorRows();
    return;
  }

  if (state.tool === 'eraser'){
    const hit = hitTestNote(track, x, y, heightCss);
    const erasedRanges = [];
    if (hit){ erasedRanges.push({ start: hit.note.start, end: hit.note.end }); removeNote(track, hit.note.id); }
    pianoInteraction = { type:'erasing', heightCss, erasedRanges };
    recomputeOverlaps(track);
    renderPianoRoll(); renderNoteProperties(); renderTrackEditorRows();
    return;
  }

  // mouse (select/move/resize) tool
  const hit = hitTestNote(track, x, y, heightCss);
  if (hit){
    if (!state.selectedNoteIds.has(hit.note.id)){
      if (!e.shiftKey) state.selectedNoteIds = new Set();
      state.selectedNoteIds.add(hit.note.id);
    }
    state.activeNoteId = hit.note.id;
    if (hit.edge){
      pianoInteraction = { type:'resize', edge: hit.edge, note: hit.note, origStart: hit.note.start, origEnd: hit.note.end };
    } else {
      const startPositions = new Map();
      state.selectedNoteIds.forEach(id => {
        const n = track.notes.find(nn => nn.id === id);
        if (n) startPositions.set(id, { start:n.start, end:n.end, pitch:n.pitch });
      });
      pianoInteraction = {
        type:'move', track, heightCss, startPositions,
        anchorBeat: worldXToBeats(timeScreenToWorldX(x)),
        anchorPitch: screenYToNote(y, heightCss),
      };
    }
    renderPianoRoll(); renderNoteProperties();
    return;
  }
  if (!e.shiftKey) state.selectedNoteIds = new Set();
  pianoInteraction = { type:'select', startX:x, startY:y, curX:x, curY:y, heightCss, initialSelection: new Set(state.selectedNoteIds) };
  renderPianoRoll(); renderNoteProperties();
}

function pianoPointerMove(e){
  if (!pianoInteraction) return;
  const rect = pianoCanvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const track = getCurrentTrack();

  switch (pianoInteraction.type){
    case 'pan': {
      state.view.pianoPitch.y += (e.clientY - pianoInteraction.lastY);
      state.view.pianoTime.x -= (e.clientX - pianoInteraction.lastX);
      pianoInteraction.lastX = e.clientX; pianoInteraction.lastY = e.clientY;
      clampPianoView(rect.height);
      renderPianoRoll(); renderNoteWave();
      break;
    }
    case 'select': {
      pianoInteraction.curX = x; pianoInteraction.curY = y;
      updateSelectionFromBox(track, pianoInteraction);
      renderPianoRoll();
      break;
    }
    case 'move': {
      if (!track) break;
      const beatNow = worldXToBeats(timeScreenToWorldX(x));
      const pitchNow = screenYToNote(y, pianoInteraction.heightCss);
      let deltaBeat = beatNow - pianoInteraction.anchorBeat;
      if (state.magnet){
        // Snap the *delta* (not the absolute position) so a selection keeps its
        // internal note-to-note spacing while moving together on the grid.
        deltaBeat = snapBeats(pianoInteraction.anchorBeat + deltaBeat) - snapBeats(pianoInteraction.anchorBeat);
      }
      const deltaPitch = pitchNow - pianoInteraction.anchorPitch;
      pianoInteraction.startPositions.forEach((orig, id) => {
        const n = track.notes.find(nn => nn.id === id);
        if (!n) return;
        const len = orig.end - orig.start;
        const newStart = Math.max(0, orig.start + deltaBeat);
        n.start = newStart; n.end = newStart + len;
        n.pitch = clamp(orig.pitch + deltaPitch, NOTE_MIN, NOTE_MAX);
      });
      renderPianoRoll();
      break;
    }
    case 'resize': {
      if (!track) break;
      let beatNow = Math.max(0, worldXToBeats(timeScreenToWorldX(x)));
      if (state.magnet) beatNow = snapBeats(beatNow);
      const n = pianoInteraction.note;
      if (pianoInteraction.edge === 'left') n.start = clamp(beatNow, 0, n.end - 0.03125);
      else n.end = Math.max(n.start + 0.03125, beatNow);
      renderPianoRoll();
      break;
    }
    case 'pencil-draw': {
      if (!track) break;
      let beatNow = Math.max(0, worldXToBeats(timeScreenToWorldX(x)));
      if (state.magnet) beatNow = snapBeats(beatNow);
      const n = pianoInteraction.note;
      if (beatNow >= pianoInteraction.anchorBeat){ n.start = pianoInteraction.anchorBeat; n.end = Math.max(pianoInteraction.anchorBeat + 0.03125, beatNow); }
      else { n.start = beatNow; n.end = pianoInteraction.anchorBeat; }
      recomputeOverlaps(track);
      renderPianoRoll();
      break;
    }
    case 'erasing': {
      const hit = hitTestNote(track, x, y, pianoInteraction.heightCss);
      if (hit){
        pianoInteraction.erasedRanges.push({ start: hit.note.start, end: hit.note.end });
        removeNote(track, hit.note.id); recomputeOverlaps(track); renderPianoRoll(); renderTrackEditorRows();
      }
      break;
    }
  }
}

function pianoPointerUp(){
  if (!pianoInteraction) return;
  const track = getCurrentTrack();
  const type = pianoInteraction.type;
  if (track && ['move','resize','pencil-draw','erasing'].includes(type)){
    recomputeOverlaps(track);
    markDirtyForInteractionCommit(track, pianoInteraction);
    renderTrackEditorRows();
  }
  if (type === 'pan') state.activeScrollingWindow = '';
  pianoInteraction = null;
  renderPianoRoll(); renderNoteProperties();
}

pianoCanvas.addEventListener('pointerdown', pianoPointerDown);
pianoCanvas.addEventListener('pointermove', pianoPointerMove);
window.addEventListener('pointerup', pianoPointerUp);
pianoCanvas.addEventListener('pointercancel', pianoPointerUp);
pianoCanvas.addEventListener('contextmenu', e => e.preventDefault());

pianoRollBody.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = pianoCanvas.getBoundingClientRect();
  const mouseInWindow = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;
  const wheel = -e.deltaY / 100;
  if (e.ctrlKey && e.shiftKey){
    const past = state.view.pianoTime.zoomX;
    // Max 3.2 (was 1.6) so the grid can reach 32nd-note resolution -- see
    // currentSubdivisionsPerBar(), which needs a bar wide enough on screen
    // to fit that many subdivisions at pianoTimeMarkersTargetPx spacing.
    const z = clamp(past + 0.1 * wheel, 0.1, 3.2);
    state.view.pianoTime.zoomX = z;
    if (wheel !== 0) state.view.pianoTime.x = (state.view.pianoTime.x + mouseInWindow) * (z / past) - mouseInWindow;
  } else if (e.ctrlKey){
    // Same anchor-preserving approach as the X zoom above (keep the pitch under
    // the cursor fixed on screen), just solved for the Y axis's flipped sign:
    // screenY = (pianoPitch.y + H) - note*keyH, vs screenX = worldX - pianoTime.x.
    const past = state.view.pianoPitch.zoomY;
    const z = Math.max(0.6, past + 0.1 * wheel);
    const r = z / past;
    state.view.pianoPitch.y = r * state.view.pianoPitch.y + (r - 1) * (rect.height - mouseY);
    state.view.pianoPitch.zoomY = z;
  } else if (e.shiftKey){
    // Pixel-space pan, not scaled by zoom -- see the TrackEditor wheel
    // handler for why (zoom-scaled pan speed crawls once you're zoomed out).
    state.view.pianoTime.x += wheel * 12.5;
  } else {
    state.view.pianoPitch.y += wheel * 12.5;
  }
  clampPianoView(rect.height);
  renderPianoRoll(); renderNoteWave();
}, { passive:false });

window.addEventListener('keydown', (e) => {
